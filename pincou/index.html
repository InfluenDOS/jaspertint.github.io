<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今夜，听我唱完 — Bird</title>
<style>
  :root { --bg:#000; --fg:#efe6dc; --dim:#8a7f78; --accent:#d8a24a; --bar:rgba(8,6,8,.78); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:"SimSun","NSimSun","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif; }
  #stage { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; }
  #c { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(0,0,0,.62); cursor:pointer; z-index:3; text-align:center; padding:0 16px; }
  #start h1 { margin:0; font-weight:400; font-size:clamp(20px,4vw,34px); letter-spacing:.32em; }
  #start .by { color:var(--dim); font-size:14px; letter-spacing:.3em; }
  #start .pl { margin-top:10px; border:1px solid var(--fg); background:transparent; color:var(--fg); font:inherit;
    font-size:16px; letter-spacing:.4em; padding:10px 26px 10px 34px; cursor:pointer; }
  #start .pl:hover { background:var(--fg); color:#000; }
  #start .tip { color:var(--dim); font-size:12px; letter-spacing:.15em; }
  #start .err { color:#e07a5a; font-size:13px; }
  #bar { position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; align-items:center; gap:12px;
    padding:10px 16px 12px; background:linear-gradient(transparent, var(--bar) 40%); transition:opacity .4s;
    font-size:13px; }
  #bar.hide { opacity:0; pointer-events:none; }
  #bar button { background:none; border:1px solid rgba(239,230,220,.5); color:var(--fg); font:inherit; font-size:13px;
    min-width:34px; height:28px; cursor:pointer; padding:0 8px; }
  #bar button:hover { border-color:var(--fg); }
  #tm { font-variant-numeric:tabular-nums; color:var(--dim); white-space:nowrap; font-family:Consolas,monospace; font-size:12px; }
  #seek { flex:1; min-width:60px; accent-color:var(--accent); height:4px; cursor:pointer; }
  #ttl { white-space:nowrap; letter-spacing:.12em; }
  #ttl small { color:var(--dim); margin-left:8px; letter-spacing:.2em; }
  @media (max-width:640px){ #ttl { display:none; } }
  #err { position:absolute; left:8px; top:8px; z-index:9; color:#ff8a6a; font:12px monospace; white-space:pre-wrap; pointer-events:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="640" height="360"></canvas>
  <div id="start">
    <h1>今夜，听我唱完</h1>
    <div class="by">BIRD · 《拼凑》</div>
    <button class="pl" id="go">▶ 播放</button>
    <div class="tip">约 3 分钟 · 建议戴耳机、全屏（F）</div>
    <div class="err" id="aerr"></div>
  </div>
  <div id="bar" class="hide">
    <button id="pp" title="播放 / 暂停（空格）">▶</button>
    <span id="tm">0:00 / 3:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="进度">
    <span id="ttl">今夜，听我唱完 — Bird<small>《拼凑》</small></span>
    <button id="fs" title="全屏（F）">⛶</button>
  </div>
  <div id="err"></div>
</div>
<audio id="a" preload="auto"><source src="bird_song_3.mp3" type="audio/mpeg"><source src="bird_song_3.ogg" type="audio/ogg"></audio>
<script>
'use strict';
// =====================================================================
//  《今夜，听我唱完》PV —— 320×180 像素画面，跟着音乐时间轴走
//  所有画面都是时间 t（秒）的纯函数：拖进度条 / 截帧都不会乱
// =====================================================================
const W = 320, H = 180, OW = 640, OH = 360;
const T_BLACK = 161.0;   // 全场一黑（长音里，乐队收掉的那一刻；待试听确认）
const T_FIRE  = 163.6;   // 台上亮起来——不是灯（乐队回来前一点点）
const DUR0 = 179.96;
const Q = new URLSearchParams(location.search);
const STILL = Q.has('t'), SELFTEST = Q.has('selftest');
const errBox = document.getElementById('err');
function showErr(m){ errBox.textContent += m + '\n'; }
window.addEventListener('error', e => showErr('ERR ' + e.message + ' @' + e.lineno));

// ---------------------------------------------------------------- 工具
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function h1(n){ const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const _hc = new Map();
function hx(c){ let v = _hc.get(c); if (!v){ const n = parseInt(c.slice(1), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; _hc.set(c, v); } return v; }
function rgb(r, g_, b, a){ r = r < 0 ? 0 : r > 255 ? 255 : r | 0; g_ = g_ < 0 ? 0 : g_ > 255 ? 255 : g_ | 0; b = b < 0 ? 0 : b > 255 ? 255 : b | 0;
  return a === undefined ? `rgb(${r},${g_},${b})` : `rgba(${r},${g_},${b},${a})`; }
function mix(a, b, t){ const A = hx(a), B = hx(b); return rgb(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
// 颜色 c 乘亮度 k，再被色光 tc（强度 tk）照
function lit(c, k, tc, tk){ const A = hx(c);
  if (!tc || !tk) return rgb(A[0] * k, A[1] * k, A[2] * k);
  const T = hx(tc);
  return rgb(A[0] * k + (A[0] * T[0] / 255 * 1.4 + T[0] * .10) * tk,
             A[1] * k + (A[1] * T[1] / 255 * 1.4 + T[1] * .10) * tk,
             A[2] * k + (A[2] * T[2] / 255 * 1.4 + T[2] * .10) * tk); }
const FIRE = '#ff7a30', COLD = '#7fc8ff';

// ---------------------------------------------------------------- 画布
function mk(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
const out = document.getElementById('c'), o = out.getContext('2d'); o.imageSmoothingEnabled = false;
const [cA, gA] = mk(W, H), [cB, gB] = mk(W, H), [cT, gT] = mk(W, H), [cM, gM] = mk(W, H);
let g = gA;

// 4×4 Bayer 抖动溶解（像素式转场）
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const MASK = [];
for (let L = 0; L <= 16; L++){
  const [p, px] = mk(4, 4); const id = px.createImageData(4, 4);
  for (let i = 0; i < 16; i++){ id.data[i * 4 + 3] = BAYER[i] < L ? 255 : 0; }
  px.putImageData(id, 0, 0);
  const [m, mx] = mk(W, H); mx.fillStyle = mx.createPattern(p, 'repeat'); mx.fillRect(0, 0, W, H); MASK.push(m);
}

// ---------------------------------------------------------------- 镜头
let cam = { x: 160, y: 90, z: 1 };
let _cx = 160, _cy = 90, _z = 1;
function layer(p){ _cx = 160 + (cam.x - 160) * p; _cy = 90 + (cam.y - 90) * p; _z = 1 + (cam.z - 1) * p; }
const SX = x => Math.round((x - _cx) * _z + W / 2), SY = y => Math.round((y - _cy) * _z + H / 2);
function R(x, y, w, h, c){
  let x1 = SX(x), y1 = SY(y), x2 = SX(x + w), y2 = SY(y + h);
  if (x2 <= x1) x2 = x1 + 1; if (y2 <= y1) y2 = y1 + 1;
  if (x2 < 0 || y2 < 0 || x1 > W || y1 > H) return;
  g.fillStyle = c; g.fillRect(x1, y1, x2 - x1, y2 - y1);
}
function glow(x, y, r, c, a){
  if (a <= .004 || r <= 0) return;
  const X = SX(x), Y = SY(y), rr = r * _z, C = hx(c);
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = `rgba(${C[0]},${C[1]},${C[2]},${(a * .22).toFixed(3)})`;
  for (let k = 4; k >= 1; k--){ g.beginPath(); g.arc(X, Y, Math.max(1, Math.round(rr * k / 4)), 0, 6.2832); g.fill(); }
  g.globalCompositeOperation = 'source-over';
}
function pool(x, y, rx, ry, c, a){   // 地上 / 墙上的扁光斑
  if (a <= .004) return;
  const X = SX(x), Y = SY(y), C = hx(c);
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = `rgba(${C[0]},${C[1]},${C[2]},${(a * .25).toFixed(3)})`;
  for (let k = 4; k >= 1; k--){ g.beginPath(); g.ellipse(X, Y, Math.max(1, Math.round(rx * _z * k / 4)), Math.max(1, Math.round(ry * _z * k / 4)), 0, 0, 6.2832); g.fill(); }
  g.globalCompositeOperation = 'source-over';
}
function vband(y0, y1, c0, c1, n){   // 屏幕空间分层渐变（像素画式色带）
  for (let i = 0; i < n; i++){
    const a = Math.round(y0 + (y1 - y0) * i / n), b = Math.round(y0 + (y1 - y0) * (i + 1) / n);
    g.fillStyle = mix(c0, c1, n > 1 ? i / (n - 1) : 0); g.fillRect(0, a, W, b - a);
  }
}
function veil(c, a){ if (a <= 0) return; const C = hx(c); g.fillStyle = `rgba(${C[0]},${C[1]},${C[2]},${a})`; g.fillRect(0, 0, W, H); }

// ---------------------------------------------------------------- 像素字
const SANS = '"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif';
const SERIF = '"SimSun","NSimSun","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif';
const _tb = new Map();
const [_tc, _tx] = (() => { const c = document.createElement('canvas'); return [c, c.getContext('2d', { willReadFrequently: true })]; })();
function bits(str, px, font, bold){
  const key = str + '|' + px + '|' + font + '|' + bold; let b = _tb.get(key); if (b) return b;
  _tc.width = Math.ceil(px * str.length * 1.3 + 12); _tc.height = px + 10;
  _tx.font = (bold ? 'bold ' : '') + px + 'px ' + font; _tx.textBaseline = 'top'; _tx.fillStyle = '#fff';
  _tx.fillText(str, 4, 3);
  const d = _tx.getImageData(0, 0, _tc.width, _tc.height).data, pts = [];
  let minx = 1e9, maxx = -1;
  for (let y = 0; y < _tc.height; y++) for (let x = 0; x < _tc.width; x++)
    if (d[(y * _tc.width + x) * 4 + 3] > 115){ pts.push(x, y - 3); if (x < minx) minx = x; if (x > maxx) maxx = x; }
  for (let i = 0; i < pts.length; i += 2) pts[i] -= minx;
  b = { pts, w: maxx >= minx ? maxx - minx + 1 : 0, h: px + 2 }; _tb.set(key, b); return b;
}
const _pt = new Map();
function ptext(str, px, font, col, ol, bold){   // 硬边像素字 + 1px 描边
  const key = [str, px, font, col, ol, bold].join('|'); let c = _pt.get(key); if (c) return c;
  const b = bits(str, px, font, bold), w = b.w + 4, h = b.h + 6;
  const [cc, cx] = mk(Math.max(1, w), h); const m = new Uint8Array(w * h);
  for (let i = 0; i < b.pts.length; i += 2){ const x = b.pts[i] + 2, y = b.pts[i + 1] + 2; if (x >= 0 && y >= 0 && x < w && y < h) m[y * w + x] = 1; }
  const id = cx.createImageData(w, h), C = hx(col), O = hx(ol);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = y * w + x; let v = m[i] ? 2 : 0;
    if (!v) for (let dy = -1; dy <= 1 && !v; dy++) for (let dx = -1; dx <= 1; dx++){
      const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < w && yy < h && m[yy * w + xx]){ v = 1; break; } }
    if (v){ const P = v === 2 ? C : O; id.data[i * 4] = P[0]; id.data[i * 4 + 1] = P[1]; id.data[i * 4 + 2] = P[2]; id.data[i * 4 + 3] = 255; }
  }
  cx.putImageData(id, 0, 0); _pt.set(key, cc); return cc;
}
// 世界坐标里画字（每个字像素一个方块，随镜头放大）
function wtext(str, x, y, px, col, font = SANS, bold = true){
  const b = bits(str, px, font, bold);
  for (let i = 0; i < b.pts.length; i += 2) R(x + b.pts[i], y + b.pts[i + 1], 1, 1, col);
  return b;
}

// ---------------------------------------------------------------- 立绘（小尺寸海报用）
const portrait = new Image(); let poster = null, photo = null;
portrait.onload = () => {
  const shrink = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(portrait, 0, 0, w, h); return c; };
  poster = shrink(14, 18); photo = shrink(9, 11);
};
portrait.src = 'portrait_bird.png';
function img(im, x, y, w, h, alpha = 1){
  if (!im) return; const x1 = SX(x), y1 = SY(y), x2 = SX(x + w), y2 = SY(y + h);
  g.globalAlpha = alpha; g.drawImage(im, x1, y1, Math.max(1, x2 - x1), Math.max(1, y2 - y1)); g.globalAlpha = 1;
}

// ---------------------------------------------------------------- 粒子（无状态：都是 t 的函数）
function flames(cx, by, w, hgt, inten, t, seed, n){
  if (inten <= 0) return;
  for (let i = 0; i < n; i++){
    if (h1(seed + i * 1.37) > inten) continue;
    const life = .55 + .5 * h1(seed + i * 2.11);
    const ph = (t / life + h1(seed + i * 3.7)) % 1;
    const x = cx + (h1(seed + i * 5.3) - .5) * w * (1 - ph * .5) + Math.sin(t * 4 + i) * 1.3 * ph;
    const y = by - ph * hgt * (.45 + .55 * h1(seed + i * 7.9));
    const sz = Math.max(1, (1 - ph) * (1.8 + 1.6 * h1(seed + i * 9.1)));
    const c = ph < .16 ? '#fff0b4' : ph < .4 ? '#ffbf46' : ph < .68 ? '#ee6824' : '#8a2414';
    R(x - sz / 2, y - sz / 2, sz, sz, c);
  }
}
function embers(x0, x1, y0, y1, n, t, seed, inten){
  for (let i = 0; i < n; i++){
    if (h1(seed + i * 1.91) > inten) continue;
    const sp = 5 + 9 * h1(seed + i * 3.3), span = y1 - y0;
    const ph = (t * sp / span + h1(seed + i * 7.7)) % 1;
    const x = x0 + (x1 - x0) * h1(seed + i * 11.3) + Math.sin(t * 1.1 + i * 2.3) * 5 * ph;
    const y = y1 - span * ph;
    if (h1(Math.floor(t * 7) * 3.1 + i * 13.7) < .82) R(x, y, 1, 1, ph < .45 ? '#ffd27a' : ph < .8 ? '#f08a3a' : '#a0402a');
  }
}
function smoke(x, y, spread, hgt, n, t, seed, a, c){
  const C = hx(c);
  for (let i = 0; i < n; i++){
    const ph = (t * (.07 + .05 * h1(seed + i)) + h1(seed + i * 2.7)) % 1;
    const px = x + (h1(seed + i * 3.1) - .5) * spread + ph * 26 * (h1(seed + i * 5.2) + .2);
    const py = y - ph * hgt;
    const r = (4 + ph * 15) * _z, al = a * Math.sin(ph * Math.PI);
    g.fillStyle = `rgba(${C[0]},${C[1]},${C[2]},${al.toFixed(3)})`;
    g.beginPath(); g.arc(SX(px), SY(py), Math.round(r), 0, 6.2832); g.fill();
  }
}
function dust(x0, x1, y0, y1, n, t, seed, a){   // 光里的浮尘
  if (a <= 0) return;
  for (let i = 0; i < n; i++){
    const px = x0 + (x1 - x0) * ((((h1(seed + i) + t * .006 * (h1(seed + i * 2) - .5)) % 1) + 1) % 1);
    const py = y0 + (y1 - y0) * ((h1(seed + i * 3) + t * .01 * (.3 + h1(seed + i * 4))) % 1);
    if (h1(Math.floor(t * 3) + i * 5.1) < .7) R(px, py, 1, 1, rgb(255, 236, 200, (a * (.25 + .4 * h1(i * 9))).toFixed(3)));
  }
}
function rain(t, dens, a){
  if (dens <= 0) return;
  const n = Math.round(150 * dens);
  g.fillStyle = `rgba(165,185,215,${a})`;
  for (let i = 0; i < n; i++){
    const sp = 230 + 120 * h1(i * 5.1);
    const y = ((h1(i * 3.3) * (H + 30) + t * sp) % (H + 30)) - 15;
    const x = ((h1(i * 1.7) * (W + 60) - y * .22) % (W + 60) + (W + 60)) % (W + 60) - 30;
    g.fillRect(Math.round(x), Math.round(y), 1, 3); g.fillRect(Math.round(x) - 1, Math.round(y) + 3, 1, 2);
  }
  g.fillStyle = `rgba(190,205,230,${a * .8})`;
  for (let i = 0; i < n * .25; i++){
    const b = Math.floor(t * 9 + h1(i * 7.7) * 9);
    if (h1(b * 1.3 + i) < .5) continue;
    const x = Math.round(h1(b * 2.1 + i * 3.9) * W), y = Math.round(150 + h1(b * 4.7 + i * .3) * 30);
    const yy = SY(y); if (yy > 0 && yy < H) g.fillRect(x, yy, 2, 1);
  }
}

// ---------------------------------------------------------------- 人
// 站着的人（背影 / 剪影）
function person(x, b, h, o = {}){
  const u = h / 26, col = o.col || '#07080d', rim = o.rim;
  const look = o.look || 0;
  const hy = b - h - look * 1.2 * u;
  R(x - 3 * u, b - 9 * u, 2.5 * u, 9 * u, col); R(x + .5 * u, b - 9 * u, 2.5 * u, 9 * u, col);
  const bodyBot = o.coat ? b - 4 * u : b - 8.5 * u;
  R(x - 4.2 * u, b - h + 6 * u, 8.4 * u, bodyBot - (b - h + 6 * u), col);
  R(x - 3.6 * u, b - h + 5 * u, 7.2 * u, 1.5 * u, col);
  R(x - 1 * u, hy + 4 * u, 2 * u, 2 * u + look * 1.2 * u, col);
  R(x - 2.1 * u, hy, 4.2 * u, 4.6 * u, col);
  if (o.hat){ R(x - 3.4 * u, hy + .4 * u, 6.8 * u, 1 * u, col); R(x - 2.2 * u, hy - 1.6 * u, 4.4 * u, 2.2 * u, col); }
  if (o.hair) R(x - 2.4 * u, hy + 1 * u, 4.8 * u, 6 * u, col);
  if (o.umb){
    const ux = x + 1 * u + look * 2.5 * u, uy = hy - 3.5 * u + look * 1.5 * u;
    R(ux, uy, .8 * u, (b - h + 9 * u) - uy, col);
    for (let k = 0; k < 4; k++){ const ww = (5 + k * 2.2) * u; R(ux - ww + .4 * u, uy - (4 - k) * 1.2 * u, ww * 2, 1.25 * u, o.ucol || col); }
    if (rim) R(ux - 5 * u, uy - 4.8 * u, 10 * u, .9 * u, rim);
  }
  if (rim){
    R(x - 2.1 * u, hy, 4.2 * u, .9 * u, rim);
    if (o.rimSide !== false) R(x + 3.4 * u, b - h + 6 * u, .9 * u, bodyBot - (b - h + 6 * u), rim);
    if (look > .5 && !o.umb) R(x - 1.6 * u, hy + .2 * u, 3.2 * u, .9 * u, rim);
  }
}
// 坐着的观众（从背后看：只露出头和肩）
function seated(cx, rowY, s, o){
  const col = o.col, rim = o.rim;
  const bob = o.sleep ? Math.sin(o.t * .85) * .35 * s : 0;
  const hx_ = cx - 2.1 * s + (o.sleep ? 1.7 * s : 0), hy = rowY - 8 * s + (o.sleep ? 1.6 * s : 0) + bob;
  R(cx - 3.8 * s, rowY - 3.2 * s, 7.6 * s, 3.4 * s, col);
  R(cx - .9 * s, rowY - 4 * s, 1.8 * s, 1.2 * s, col);
  R(hx_, hy, 4.2 * s, 4.6 * s, col);
  if (o.hat){ R(hx_ - 1.3 * s, hy + .6 * s, 6.8 * s, .9 * s, col); R(hx_ - .1 * s, hy - 1.5 * s, 4.4 * s, 2.2 * s, col); }
  if (o.hair) R(hx_ - .3 * s, hy + 1.2 * s, 4.8 * s, 4 * s, col);
  if (rim){ R(o.hat ? hx_ - .1 * s : hx_, o.hat ? hy - 1.5 * s : hy, 4.2 * s, .8, rim); if (o.hat) R(hx_ - 1.3 * s, hy + .6 * s, 6.8 * s, .7, rim);
    R(cx - 3.8 * s, rowY - 3.2 * s, 7.6 * s, .8, rim); }
}
// Bird：全身，远景。front=面向观众（脸只是一块阴影，不画五官）；back=背影
function bird(x, b, h, o = {}){
  const u = h / 34, k = o.k ?? 1, tc = o.tc, tk = o.tk || 0;
  const S = o.sil || 0;
  const C = c => S ? mix(lit(c, k, tc, tk), '#080406', S) : lit(c, k, tc, tk);
  const dress = C('#6a1626'), dressL = C('#9a3444'), dressD = C('#3a0a14'), hair = C('#5a1422'), hairL = C('#8e2a3a'),

function flick(t){
  if (t < 156.8) return 1;
  if (t >= T_BLACK) return 0;
  const b = Math.floor(t * 11), p = ss(156.8, 160.9, t) * .5;
  let v = h1(b * 7.3) < p ? .38 + .4 * h1(b * 3.1) : 1;
  return v * (1 - .45 * ss(160.3, T_BLACK, t));
}
function hallState(t){
  const L = flick(t);
  const off1 = 1 - ss(93.8, 98.6, t);
  const tier = [0, 0, 0, 0];
  for (let k = 0; k < 3; k++){
    tier[k] = Math.max(ss(69.6 + k * .6, 70.5 + k * .6, t) * off1 * (t < 99.2 ? 1 : 0), ss(132.0 + k * .9, 132.9 + k * .9, t));
  }
  tier[3] = Math.max(ss(72.8, 74.3, t) * off1 * (t < 99.2 ? 1 : 0), ss(139.4, 140.8, t));
  for (let k = 0; k < 4; k++) tier[k] *= L;
  let spot = 1;
  if (t > 29.9 && t < 34.5) spot = 1 - .35 * ss(29.9, 31.6, t) + .35 * ss(33.8, 34.5, t);
  if (t > 94 && t < 99.2) spot = 1 - .4 * ss(94, 97, t) + .4 * ss(98.4, 99.2, t);
  if (t > 124.7 && t < 131.8) spot = 1 - .5 * ss(124.7, 129, t) + .5 * ss(130.6, 131.8, t);
  spot *= L;
  const chorus = Math.max(ss(65, 69.5, t) * (1 - ss(94, 98, t)) * (t < 99.2 ? 1 : 0), ss(131, 132.5, t));
  const foot = (.35 + .65 * chorus) * L;
  const house = Math.max(tier[0], tier[1], tier[2], tier[3] * .8);
  const ember = ss(T_FIRE - 1.0, T_FIRE + .3, t);
  const bf = ss(T_FIRE, T_FIRE + 2.2, t);

  const cl = ss(T_FIRE + 1.8, T_FIRE + 5.0, t), cr = ss(T_FIRE + 2.6, T_FIRE + 5.8, t);
  const fire = .55 * bf + .45 * Math.max(cl, cr);
  return { L, tier, spot, foot, house, ember, bf, floorF, cl, cr, fire, spread: ss(19.6, 24.4, t) * .85 + .15 };
}
function streetState(t){
  const c1 = t >= 62 && t < 99.2, c2 = t >= 131.8 && t < 161;

function signChar(t, ci){

}

function camAt(keys, t){
  if (t <= keys[0][0]) return keys[0];
  for (let i = 0; i < keys.length - 1; i++){
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]){ const k = ss(a[0], b[0], t); return [t, lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)]; }
  }
  return keys[keys.length - 1];
}
function shotAt(t){ let i = 0; while (i + 1 < SHOTS.length && SHOTS[i + 1].t0 <= t) i++; return i; }
function drawShot(sh, t, ctx){
  g = ctx; const c = camAt(sh.cam, t); cam.x = c[1]; cam.y = c[2]; cam.z = c[3];
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  sh.scene(t, sh.o || {});
  layer(1);
}

// ---------------------------------------------------------------- 合成到 640×360
const BAR = 20;   // 上下黑边（2× 画布像素）
function compose(t){
  const i = shotAt(t), s = SHOTS[i];
  drawShot(s, t, gA);
  let src = cA;
  if (i > 0 && s.xf > 0 && t < s.t0 + s.xf){
    drawShot(SHOTS[i - 1], t, gB);
    const lv = Math.round(clamp((t - s.t0) / s.xf) * 16);
    gT.globalCompositeOperation = 'copy'; gT.drawImage(cA, 0, 0);
    gT.globalCompositeOperation = 'destination-in'; gT.drawImage(MASK[lv], 0, 0);
    gT.globalCompositeOperation = 'source-over';
    gM.globalCompositeOperation = 'copy'; gM.drawImage(cB, 0, 0); gM.globalCompositeOperation = 'source-over'; gM.drawImage(cT, 0, 0);
    src = cM;
  }
  // 开头从黑里溶出来
  const fin = clamp(t / 1.6);
  if (fin < 1){
    gT.globalCompositeOperation = 'copy'; gT.drawImage(src, 0, 0);
    gT.globalCompositeOperation = 'destination-in'; gT.drawImage(MASK[Math.round(fin * 16)], 0, 0);
    gT.globalCompositeOperation = 'source-over';
    gM.fillStyle = '#000'; gM.globalCompositeOperation = 'source-over'; gM.fillRect(0, 0, W, H); gM.drawImage(cT, 0, 0); src = cM;
  }
  o.globalAlpha = 1; o.imageSmoothingEnabled = false;
  o.drawImage(src, 0, 0, OW, OH);
  o.fillStyle = '#000'; o.fillRect(0, 0, OW, BAR); o.fillRect(0, OH - BAR, OW, BAR);
  overlay(t);
}
function blit(c, x, y, a){ if (a <= 0) return; o.globalAlpha = clamp(a); o.drawImage(c, Math.round(x - c.width / 2), Math.round(y)); o.globalAlpha = 1; }
function overlay(t){
  // 字幕（像电影字幕：宋体、白字黑边）
  for (const [a, b, txt] of LY){
    if (t < a - .1 || t > b + .35) continue;
    const al = Math.min(ss(a - .1, a + .12, t), 1 - ss(b, b + .35, t));
    blit(ptext(txt, 16, SERIF, '#f2ebe0', '#0a0606'), OW / 2, OH - BAR - 30, al);
  }
  // 片头
  if (t > 1.8 && t < 11.2){
    const al = Math.min(ss(1.8, 3.2, t), 1 - ss(9.6, 11.2, t));
    blit(ptext('今夜，听我唱完', 24, SERIF, '#f4ece0', '#000000'), 132, 64, al);
    blit(ptext('B I R D', 12, SERIF, '#d8a24a', '#000000'), 132, 100, al * ss(2.6, 3.8, t));
  }
  // 片尾
  if (t > 177.4){
    const al = ss(177.4, 179.4, t);
    blit(ptext('今夜，听我唱完', 24, SERIF, '#2a2024', '#e8dccb'), 176, 70, al);
    blit(ptext('— Bird —', 12, SERIF, '#4a3a3a', '#e8dccb'), 176, 106, al);
    blit(ptext('《拼凑》', 12, SERIF, '#4a3a3a', '#e8dccb'), 176, 128, al * ss(178.2, 179.8, t));
  }
}

// ---------------------------------------------------------------- 播放器
const audio = document.getElementById('a'), stage = document.getElementById('stage');
const startEl = document.getElementById('start'), bar = document.getElementById('bar');
const pp = document.getElementById('pp'), seek = document.getElementById('seek'), tm = document.getElementById('tm'), fsb = document.getElementById('fs');
const dur = () => (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : DUR0;
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + String(r).padStart(2, '0'); };
let dragging = false, dragT = 0, _la = -1, _lp = 0, started = false;
function curT(){
  if (dragging) return dragT;
  const a = audio.currentTime;
  if (audio.paused || audio.ended) return a;
  const p = performance.now(); if (a !== _la){ _la = a; _lp = p; }
  return Math.min(dur(), a + Math.min(.3, (p - _lp) / 1000));
}
function fit(){
  const k = Math.min(innerWidth / OW, innerHeight / OH);
  const kk = k >= 1 ? Math.floor(k * 2) / 2 : k;
  out.style.width = Math.round(OW * kk) + 'px'; out.style.height = Math.round(OH * kk) + 'px';
}
addEventListener('resize', fit); fit();
function play(){
  started = true; startEl.style.display = 'none';
  if (audio.ended || audio.currentTime >= dur() - .05) audio.currentTime = 0;
  const p = audio.play(); if (p && p.catch) p.catch(e => { startEl.style.display = 'flex'; document.getElementById('aerr').textContent = '音频播放失败：' + e.message; });
  poke();
}
document.getElementById('go').onclick = e => { e.stopPropagation(); play(); };
startEl.onclick = play;
pp.onclick = () => { if (audio.paused) play(); else audio.pause(); };
audio.addEventListener('play', () => pp.textContent = '❚❚');
audio.addEventListener('pause', () => { pp.textContent = '▶'; poke(); });
audio.addEventListener('ended', () => { pp.textContent = '↺'; bar.classList.remove('hide'); });
audio.addEventListener('error', () => { document.getElementById('aerr').textContent = '找不到 bird_song_3.ogg（要和本页放在同一个文件夹）'; });
seek.addEventListener('input', () => { dragging = true; dragT = seek.value / 1000 * dur(); });
seek.addEventListener('change', () => { audio.currentTime = dragT; _la = -1; dragging = false; });
function toggleFs(){
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
  else { const f = stage.requestFullscreen || stage.webkitRequestFullscreen; if (f) f.call(stage); }
}
fsb.onclick = toggleFs;
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); if (!started) play(); else pp.click(); }
  else if (e.key === 'f' || e.key === 'F') toggleFs();
  else if (e.key === 'ArrowRight'){ audio.currentTime = Math.min(dur(), audio.currentTime + 5); poke(); }
  else if (e.key === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - 5); poke(); }
});
let idle = 0;
function poke(){ idle = performance.now(); if (started) bar.classList.remove('hide'); }
stage.addEventListener('mousemove', poke); stage.addEventListener('touchstart', poke, { passive: true });
bar.addEventListener('mouseenter', () => { idle = 1e12; }); bar.addEventListener('mouseleave', poke);

function loop(){
  const t = STILL ? parseFloat(Q.get('t')) : (started ? curT() : 1.7);
  try { compose(t); } catch (e){ showErr('ERR ' + e.message + '\n' + (e.stack || '')); }
  if (!STILL){
    if (!dragging) seek.value = Math.round(t / dur() * 1000);
    tm.textContent = fmt(t) + ' / ' + fmt(dur());
    if (started && !audio.paused && performance.now() - idle > 2600) bar.classList.add('hide');
  }
  requestAnimationFrame(loop);
}
if (STILL){ startEl.style.display = 'none'; bar.style.display = 'none'; }
if (SELFTEST){
  startEl.style.display = 'none'; bar.style.display = 'none';
  const res = []; let worst = 0, n = 0;
  for (let t = 0; t <= 180.5; t += .1){
    const a = performance.now();
    try { compose(t); } catch (e){ res.push(t.toFixed(1) + ': ' + e.message); }
    worst = Math.max(worst, performance.now() - a); n++;
  }
  document.title = 'SELFTEST ' + (res.length ? 'FAIL' : 'OK');
  const d = document.createElement('pre'); d.id = 'selftest';
  d.textContent = `SELFTEST ${res.length ? 'FAIL' : 'OK'} frames=${n} worst_ms=${worst.toFixed(1)}\n` + res.slice(0, 20).join('\n');
  document.body.appendChild(d);
} else requestAnimationFrame(loop);
