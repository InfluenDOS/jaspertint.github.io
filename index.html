<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惊棠工作室 | Jingtang Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1C1D22;
            --surface: #313B44;
            --mid: #606467;
            --silver: #AAA8AD;
            --accent: #E62815;
            --accent-soft: #8B4944;
            --glass: rgba(49, 59, 68, 0.42);
            --glass-border: rgba(170, 168, 173, 0.14);
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            text-align: center;
        }

        .loader-logo {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            opacity: 0;
            animation: loaderFadeIn 0.6s ease forwards;
        }

        .loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* PNG 自带纯黑底：与 --bg 融合，避免「黑方块」 */
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 24px rgba(230, 40, 21, 0.35));
        }

        .loader-text {
            color: var(--silver);
            letter-spacing: 0.35em;
            font-size: 0.82em;
            font-weight: 500;
            opacity: 0;
            animation: loaderFadeIn 0.6s ease 0.3s forwards;
        }

        @keyframes loaderFadeIn {
            to { opacity: 1; }
        }

        .cursor-glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 40, 21, 0.07) 0%, rgba(139, 73, 68, 0.04) 35%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .tech-grid {
            position: absolute;
            inset: -25% -10%;
            background-image:
                linear-gradient(rgba(170, 168, 173, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(170, 168, 173, 0.055) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 85% 75% at 50% 35%, #000 20%, transparent 70%);
            opacity: 0.85;
            will-change: transform;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            will-change: transform;
        }

        .glow-orb--1 {
            width: min(90vw, 520px);
            height: min(90vw, 520px);
            top: -12%;
            right: -8%;
            background: radial-gradient(circle, rgba(230, 40, 21, 0.35) 0%, transparent 68%);
        }

        .glow-orb--2 {
            width: min(100vw, 640px);
            height: min(100vw, 640px);
            bottom: -18%;
            left: -15%;
            background: radial-gradient(circle, rgba(139, 73, 68, 0.45) 0%, transparent 65%);
        }

        .glow-orb--3 {
            width: 420px;
            height: 420px;
            top: 42%;
            left: 50%;
            margin-left: -210px;
            background: radial-gradient(circle, rgba(49, 59, 68, 0.9) 0%, transparent 70%);
            opacity: 0.35;
            filter: blur(64px);
        }

        .scan-line {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(28, 29, 34, 0.12) 2px,
                rgba(28, 29, 34, 0.12) 4px
            );
            pointer-events: none;
            opacity: 0.35;
            mix-blend-mode: multiply;
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            will-change: transform;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.55;
            will-change: transform;
        }

        .particle.accent {
            background: var(--accent);
            box-shadow: 0 0 8px rgba(230, 40, 21, 0.45);
        }

        .particle.muted {
            background: var(--mid);
            box-shadow: 0 0 4px rgba(96, 100, 103, 0.4);
        }

        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 72px 20px 80px;
        }

        [data-parallax] {
            will-change: transform;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo-mark {
            width: 240px;
            height: 240px;
            margin: 0 auto 28px;
            position: relative;
            animation: breathe 5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .logo-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 28px rgba(230, 40, 21, 0.28));
        }

        .studio-name {
            font-size: clamp(2.2rem, 8vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 0.42em;
            margin-bottom: 14px;
            margin-right: -0.42em;
            background: linear-gradient(105deg, var(--silver) 0%, #fff 22%, var(--accent) 55%, var(--accent-soft) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 8s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 100% center; }
        }

        .studio-name-en {
            font-size: 0.78rem;
            letter-spacing: 0.55em;
            margin-right: -0.55em;
            color: var(--silver);
            opacity: 0.85;
            font-weight: 500;
            font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
            text-transform: uppercase;
        }

        .divider {
            width: 120px;
            height: 1px;
            margin: 32px auto 40px;
            position: relative;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
            overflow: visible;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            background: var(--accent);
            box-shadow: 0 0 14px rgba(230, 40, 21, 0.65);
            border-radius: 1px;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .junk-section {
            width: 100%;
            max-width: 920px;
            margin: 0 auto 40px;
            padding: 28px 24px 32px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 4px 48px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .junk-title {
            font-size: 0.95rem;
            letter-spacing: 0.42em;
            margin-right: -0.42em;
            color: var(--silver);
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .junk-intro-block {
            max-width: 640px;
            margin: 0 auto;
        }

        .junk-intro {
            font-size: 0.94rem;
            line-height: 1.85;
            color: rgba(255, 255, 255, 0.78);
            text-align: center;
            margin: 0 0 20px;
            letter-spacing: 0.04em;
        }

        .junk-quote {
            margin: 0;
            padding: 14px 16px 14px 18px;
            border-radius: 10px;
            border-left: 3px solid rgba(230, 40, 21, 0.45);
            background: rgba(28, 29, 34, 0.35);
            font-size: 0.76rem;
            line-height: 1.72;
            font-style: italic;
            color: var(--silver);
            opacity: 0.92;
            text-align: left;
            letter-spacing: 0.02em;
        }

        .junk-quote p {
            margin: 0 0 0.55em;
        }

        .junk-quote cite {
            display: block;
            font-style: italic;
            font-size: 0.9em;
            color: rgba(170, 168, 173, 0.65);
            letter-spacing: 0.04em;
        }

        .junk-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 24px;
        }

        .junk-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            padding: 12px 8px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            text-align: center;
            transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
            background: rgba(28, 29, 34, 0.35);
        }

        .junk-card__icon {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
        }

        .junk-card__name {
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            line-height: 1.35;
            color: rgba(255, 255, 255, 0.92);
        }

        .junk-card--live {
            text-decoration: none;
            color: #fff;
            background: rgba(49, 59, 68, 0.55);
            border-color: rgba(230, 40, 21, 0.35);
            cursor: pointer;
        }

        .junk-card--live:hover {
            transform: translateY(-3px);
            border-color: rgba(230, 40, 21, 0.75);
            box-shadow: 0 12px 36px rgba(230, 40, 21, 0.12);
            background: rgba(49, 59, 68, 0.72);
        }

        .junk-card--placeholder {
            opacity: 0.42;
            background: rgba(28, 29, 34, 0.25);
            color: rgba(170, 168, 173, 0.45);
            cursor: not-allowed;
            pointer-events: none;
            user-select: none;
        }

        .junk-card__pending {
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            color: rgba(170, 168, 173, 0.38);
        }

        @media (max-width: 720px) {
            .junk-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .contact {
            text-align: center;
            padding: 22px 28px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            max-width: 420px;
            width: 100%;
        }

        .contact-label {
            font-size: 0.72rem;
            color: var(--silver);
            opacity: 0.75;
            letter-spacing: 0.36em;
            margin-right: -0.36em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .contact-email {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.62);
            letter-spacing: 0.08em;
            transition: color 0.25s ease;
        }

        .contact:hover .contact-email {
            color: var(--accent);
        }

        .footer-divider {
            width: 100%;
            max-width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
            margin: 36px auto 28px;
        }

        .footer {
            text-align: center;
            font-size: 0.72rem;
            color: rgba(170, 168, 173, 0.38);
            letter-spacing: 0.12em;
            padding-bottom: constant(safe-area-inset-bottom);
            padding-bottom: env(safe-area-inset-bottom);
        }

        @media (max-width: 600px) {
            .cursor-glow {
                display: none;
            }

            .logo-mark {
                animation: none;
            }

            .glow-orb {
                filter: blur(64px);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .logo-section, .junk-section, .contact, .divider, .footer-divider, .footer {
            opacity: 0;
        }

        .page-loaded .logo-section { animation: fadeIn 0.9s ease-out 0.15s forwards; }
        .page-loaded .divider { animation: fadeIn 0.8s ease-out 0.3s forwards; }
        .page-loaded .junk-section { animation: fadeIn 0.95s ease-out 0.4s forwards; }
        .page-loaded .contact { animation: fadeIn 0.9s ease-out 0.55s forwards; }
        .page-loaded .footer-divider { animation: fadeIn 0.8s ease-out 0.65s forwards; }
        .page-loaded .footer { animation: fadeIn 0.85s ease-out 0.72s forwards; }
    </style>
</head>
<body>
    <div class="page-loader" id="pageLoader">
        <div class="loader-content">
            <div class="loader-logo">
                <img src="logo.png?v=3" alt="惊棠工作室 Logo">
            </div>
            <div class="loader-text">惊棠工作室</div>
        </div>
    </div>

    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="bg-decoration" aria-hidden="true">
        <div class="tech-grid parallax-layer" data-speed="0.14"></div>
        <div class="glow-orb glow-orb--1 parallax-layer" data-speed="0.32"></div>
        <div class="glow-orb glow-orb--2 parallax-layer" data-speed="0.22"></div>
        <div class="glow-orb glow-orb--3 parallax-layer" data-speed="0.4"></div>
        <div class="scan-line parallax-layer" data-speed="0.06"></div>
    </div>

    <div class="particles-container" id="particlesContainer"></div>

    <div class="container">
        <div class="logo-section" data-parallax="0.11">
            <div class="logo-mark">
                <img src="logo.png?v=3" alt="惊棠工作室 Logo">
            </div>
            <h1 class="studio-name">惊棠</h1>
            <p class="studio-name-en">JASPERTINT STUDIO</p>
        </div>

        <div class="divider" data-parallax="0.07"></div>

        <section class="junk-section" aria-labelledby="junk-title" data-parallax="0.05">
            <h2 id="junk-title" class="junk-title">拾垃圾项目</h2>
            <div class="junk-intro-block">
                <p class="junk-intro">它们都很无聊，但仍然希望它们能带给你快乐，哪怕只有一分钟；</p>
                <blockquote class="junk-quote">
                    <p>「你的前十个游戏都会很烂，所以尽快把它们做完，好把它们从你的系统里清理出去。」</p>
                    <cite>——Jesse Schell</cite>
                </blockquote>
            </div>
            <div class="junk-grid">
                <a href="territory-guardian/" class="junk-card junk-card--live">
                    <img class="junk-card__icon" src="game-diyu-icon.jpg" width="128" height="128" alt="" decoding="async" loading="lazy">
                    <span class="junk-card__name">地域守护者</span>
                </a>
                <a href="strategy-and-sword/" class="junk-card junk-card--live">
                    <img class="junk-card__icon" src="game-sas-icon.png" width="128" height="128" alt="" decoding="async" loading="lazy">
                    <span class="junk-card__name">剑客与权臣</span>
                </a>
                <div class="junk-card junk-card--placeholder" aria-disabled="true">
                    <span class="junk-card__pending">敬请期待</span>
                </div>
                <div class="junk-card junk-card--placeholder" aria-disabled="true">
                    <span class="junk-card__pending">敬请期待</span>
                </div>
                <div class="junk-card junk-card--placeholder" aria-disabled="true">
                    <span class="junk-card__pending">敬请期待</span>
                </div>
                <div class="junk-card junk-card--placeholder" aria-disabled="true">
                    <span class="junk-card__pending">敬请期待</span>
                </div>
                <div class="junk-card junk-card--placeholder" aria-disabled="true">
                    <span class="junk-card__pending">敬请期待</span>
                </div>
                <div class="junk-card junk-card--placeholder" aria-disabled="true">
                    <span class="junk-card__pending">敬请期待</span>
                </div>
                <div class="junk-card junk-card--placeholder" aria-disabled="true">
                    <span class="junk-card__pending">敬请期待</span>
                </div>
                <div class="junk-card junk-card--placeholder" aria-disabled="true">
                    <span class="junk-card__pending">敬请期待</span>
                </div>
            </div>
        </section>

        <div class="contact" data-parallax="0.08">
            <p class="contact-label">联系我们</p>
            <p class="contact-email">speechlessgorilla@gmail.com</p>
        </div>

        <div class="footer-divider" data-parallax="0.04"></div>

        <div class="footer" data-parallax="0.03">
            © 2026 惊棠工作室 JASPERTINT STUDIO. ALL RIGHTS RESERVED.
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('pageLoader').classList.add('hidden');
                document.body.classList.add('page-loaded');
            }, 800);
        });

        const cursorGlow = document.getElementById('cursorGlow');
        let mouseX = 0, mouseY = 0;
        let glowX = 0, glowY = 0;

        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

        if (!isTouchDevice) {
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animateGlow() {
                glowX += (mouseX - glowX) * 0.1;
                glowY += (mouseY - glowY) * 0.1;
                cursorGlow.style.left = glowX + 'px';
                cursorGlow.style.top = glowY + 'px';
                requestAnimationFrame(animateGlow);
            }
            animateGlow();
        } else {
            cursorGlow.style.display = 'none';
        }

        const parallaxLayers = document.querySelectorAll('.parallax-layer');
        const parallaxContent = document.querySelectorAll('[data-parallax]');
        const particlesContainer = document.getElementById('particlesContainer');
        let parallaxTicking = false;

        function updateParallax() {
            const scrolled = window.pageYOffset;

            parallaxLayers.forEach(function(layer) {
                const speed = parseFloat(layer.dataset.speed) || 0.2;
                const y = scrolled * speed;
                const x = scrolled * speed * 0.15;
                if (layer.classList.contains('tech-grid')) {
                    layer.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0)';
                } else {
                    layer.style.transform = 'translate3d(0, ' + y + 'px, 0)';
                }
            });

            parallaxContent.forEach(function(el) {
                const k = parseFloat(el.getAttribute('data-parallax')) || 0;
                el.style.transform = 'translate3d(0, ' + (scrolled * k) + 'px, 0)';
            });

            if (particlesContainer) {
                particlesContainer.style.transform = 'translate3d(0, ' + (scrolled * 0.1) + 'px, 0)';
            }

            parallaxTicking = false;
        }

        function requestParallax() {
            if (!parallaxTicking) {
                requestAnimationFrame(updateParallax);
                parallaxTicking = true;
            }
        }

        window.addEventListener('scroll', requestParallax, { passive: true });
        updateParallax();

        const particleCount = isTouchDevice ? 14 : 24;
        const particles = [];

        class Particle {
            constructor() {
                this.element = document.createElement('div');
                this.element.className = 'particle ' + (Math.random() > 0.45 ? 'accent' : 'muted');
                this.reset();
                particlesContainer.appendChild(this.element);
            }

            reset() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 2.5 + 1.5;
                this.speedX = (Math.random() - 0.5) * 0.28;
                this.speedY = -Math.random() * 0.48 - 0.18;
                this.opacity = Math.random() * 0.35 + 0.28;

                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                this.element.style.opacity = this.opacity;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) * 0.18;

                if (this.y < -10) {
                    this.y = window.innerHeight + 10;
                    this.x = Math.random() * window.innerWidth;
                }

                if (this.x < -10) this.x = window.innerWidth + 10;
                if (this.x > window.innerWidth + 10) this.x = -10;

                this.element.style.transform = 'translate(' + this.x + 'px, ' + this.y + 'px)';
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        let frameCount = 0;
        function animateParticles() {
            frameCount++;
            if (frameCount % 2 === 0) {
                particles.forEach(function(p) { p.update(); });
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('resize', function() {
            particles.forEach(function(p) {
                if (p.x > window.innerWidth) p.x = Math.random() * window.innerWidth;
                if (p.y > window.innerHeight) p.y = Math.random() * window.innerHeight;
            });
        });
    </script>
</body>
</html>
