<script>
/* ============================================================
   Shared GLSL: noise, beach shape, swash, sky and clouds.
   The beach height function is mirrored in JS (sandH) so props
   and people sit exactly on the rendered sand.
   ============================================================ */
const GLSL_COMMON = /* glsl */`
#ifndef PI
#define PI 3.141592653589793
#endif
uniform float uTime;
uniform vec3  uSunDir;
uniform vec3  uSunColor;
uniform vec3  uZenith;
uniform vec3  uHorizon;
uniform vec3  uCloudLit;
uniform vec3  uCloudDark;
uniform float uCloud;
uniform vec2  uWindOff;
uniform float uRun;
uniform float uSurf;
uniform float uWind;
uniform float uSheen;
uniform float uFoam;
uniform vec3  uHill;
uniform vec3  uHillFar;
uniform float uRain;
uniform float uBank;
uniform float uHaze;

const float KS = 0.6283;   // surf wavenumber (10 m)
const float WS = 0.8378;   // surf angular speed (7.5 s)
const float LMIN = -0.07;  // lowest backwash level

float sq(float x){ return x * x; }
float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x),
             mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float a = 0.5, s = 0.0;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = m * p; a *= 0.5; }
  return s;
}
float fbm3(vec2 p){
  float a = 0.5, s = 0.0;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = m * p; a *= 0.5; }
  return s * 1.14;
}

/* ---- beach shape (mirrored in JS) ---- */
float shoreZ(float x){
  return 2.0 + 0.55 * sin(0.05 * x + 0.5) + 0.35 * sin(0.17 * x + 2.0) + 0.18 * sin(0.41 * x + 1.3);
}
float shoreSlope(float x){
  return 0.55 * 0.05 * cos(0.05 * x + 0.5) + 0.35 * 0.17 * cos(0.17 * x + 2.0) + 0.18 * 0.41 * cos(0.41 * x + 1.3);
}
float sandH(vec2 p){
  float s = p.y - shoreZ(p.x);
  float h = s > 0.0 ? 0.075 * s + 0.0012 * s * s : 0.075 * s / (1.0 - 0.012 * s);
  h += 0.22 * exp(-sq((s + 7.5) / 2.6)) * (0.7 + 0.3 * sin(p.x * 0.11 + 1.0));
  float beach = smoothstep(0.5, 4.0, s);
  h += beach * (0.07 * sin(0.55 * p.x + 0.3 * p.y + 1.0) * sin(0.4 * p.y - 0.2 * p.x)
              + 0.035 * sin(1.3 * p.x - 0.9 * p.y + 2.0)
              + 0.02 * sin(2.1 * p.x + 1.7 * p.y));
  float under = 1.0 - smoothstep(-1.0, 0.5, s);
  h += under * 0.02 * sin(2.4 * p.y + 0.6 * sin(p.x * 0.8));
  return h;
}

/* ---- surf phase: bent, irregular crests; the swash uses the same phase at the shoreline ---- */
float surfPhi(float x){
  return 0.9 * sin(0.045 * x + 0.3) + 0.5 * sin(0.13 * x + 1.7) + 0.25 * sin(0.31 * x + 4.0);
}
float surfWarp(vec2 p){
  return 1.4 * vnoise(p * 0.055) + 0.55 * vnoise(p * 0.14 + 4.0);
}
float surfSeg(float x, float wave){
  return vnoise(vec2(x * 0.09 + wave * 3.7, wave * 1.3));
}
float swashLevel(float x, out float p, out float amp){
  float th0 = surfPhi(x) + surfWarp(vec2(x, shoreZ(x)));
  float v = (PI * 0.5 + WS * uTime - th0) / (2.0 * PI);
  float n = floor(v);
  p = fract(v);
  amp = uRun * (0.45 + 0.95 * surfSeg(x, n)) * (0.88 + 0.24 * vnoise(vec2(x * 0.55, n * 2.1)));
  if (p < 0.2) return mix(LMIN, amp, sin(p / 0.2 * PI * 0.5));
  return mix(amp, LMIN, smoothstep(0.0, 1.0, (p - 0.2) / 0.8));
}

/* ---- clouds ----
   One cover map (a tiling noise texture drifting with the wind) decides where clouds stand.
   The volumetric cloud pass, the ground cloud shadows, the sun's occlusion and the water's
   reflections all read it, so they always agree. */
uniform sampler2D tCover;
uniform vec2 uCloudOff;
const float CLOUD_BASE = 650.0;
const float CLOUD_TOP = 2600.0;
float coverage(vec2 xz){
  vec2 uv = (xz + uCloudOff) / 15000.0;
  float n = texture2D(tCover, uv).r * 0.8 + texture2D(tCover, uv * 2.1 + 0.37).r * 0.2;
  return smoothstep(1.0 - uCloud, 1.0 - uCloud + 0.4, n);
}
// Shadow from the clouds the sun's ray crosses on its way to this point.
float cloudShadow(vec3 p){
  float t = (1300.0 - p.y) / max(uSunDir.y, 0.03);
  vec2 q = p.xz + uSunDir.xz * t;
  return 1.0 - (0.66 + 0.3 * uRain) * smoothstep(0.05, 0.5, coverage(q));
}
vec3 skyBase(vec3 d){
  float y = max(d.y, 0.0);
  vec3 col = mix(uHorizon, uZenith, pow(y, 0.5));
  col += uHorizon * 0.12 * exp(-y * 16.0);
  float sd = max(dot(d, uSunDir), 0.0);
  col += uSunColor * (0.03 * pow(sd, 4.0) + 0.1 * pow(sd, 32.0) + 0.4 * pow(sd, 380.0));
  return col;
}
// Cheap stand-in for the clouds, used in reflections on the water and wet sand.
vec4 cloudLayer(vec3 d, bool hq){
  if (d.y <= 0.004) return vec4(0.0);
  float t = (1300.0 - cameraPosition.y) / d.y;
  vec2 q = cameraPosition.xz + d.xz * t;
  float cov = coverage(q);
  float a = smoothstep(0.05, 0.45, cov) * (1.0 - smoothstep(20000.0, 45000.0, t));
  if (a < 0.002) return vec4(0.0);
  float sd = max(dot(d, uSunDir), 0.0);
  vec3 c = mix(uCloudDark, uCloudLit, 0.5 + 0.3 * (1.0 - cov)) + uSunColor * (0.05 + 0.4 * pow(sd, 8.0)) * (1.0 - cov);
  float haze = 1.0 - exp(-t * 0.000045 * (1.0 + 4.0 * uRain));
  return vec4(mix(c, uHorizon, haze), a * 0.95);
}
vec3 skyColor(vec3 d, bool withClouds){
  vec3 col = skyBase(d);
  if (withClouds){ vec4 cl = cloudLayer(d, false); col = mix(col, cl.rgb, cl.a); }
  return col;
}

/* ---- distant ranges on the left: three layers of haze-softened ridges ---- */
// far range: rounded massifs with rugged crests (no single sharp spike)
float farH(float az){
  float m = smoothstep(-0.95, -0.72, az) * (1.0 - smoothstep(-0.2, -0.03, az));
  if (m <= 0.0) return 0.0;
  float h = 0.022 * exp(-sq((az + 0.74) / 0.09))
          + 0.044 * exp(-sq((az + 0.59) / 0.075))
          + 0.056 * exp(-sq((az + 0.44) / 0.06))
          + 0.034 * exp(-sq((az + 0.3) / 0.065));
  h += 0.010 * fbm3(vec2(az * 14.0, 2.0)) + 0.004 * fbm3(vec2(az * 60.0, 5.0));
  return m * (0.008 + h);
}
float midH(float az){
  float m = smoothstep(-0.95, -0.7, az) * (1.0 - smoothstep(-0.3, -0.12, az));
  if (m <= 0.0) return 0.0;
  return m * (0.006 + 0.03 * pow(fbm3(vec2(az * 9.0 + 5.0, 0.3)), 1.4) + 0.006 * fbm3(vec2(az * 45.0, 1.0)));
}
float nearH(float az){
  float m = 1.0 - smoothstep(-0.52, -0.36, az);
  if (m <= 0.0) return 0.0;
  return m * (0.003 + 0.014 * fbm3(vec2(az * 16.0 + 2.0, 4.0)));
}
// how much the two nearer ranges hide whatever lies beyond them in direction d
float mountainCover(vec3 d){
  float az = atan(d.x, -d.z);
  float h = max(midH(az), nearH(az));
  if (h < 1e-4) return 0.0;
  return smoothstep(h + 0.0006, h - 0.0006, d.y);
}
vec3 mountains(vec3 d, vec3 col){
  if (d.y > 0.09 || d.y < -0.03) return col;
  float az = atan(d.x, -d.z);
  float y = d.y;
  float sunAz = atan(uSunDir.x, -uSunDir.z);
  float toSun = sign(sunAz - az);
  float mh = clamp((uHaze - 0.0022) * 160.0, 0.0, 0.8);   // rain and haze swallow the ranges
  float h1 = farH(az);
  if (h1 > 0.0) {
  float h1b = farH(az + 0.004);
  float lit1 = clamp(0.5 + (h1b - h1) * 55.0 * toSun, 0.0, 1.0);
  float a1 = smoothstep(h1 + 0.0008, h1 - 0.0008, y) * step(1e-4, h1);   // only where this range exists
  float streak = fbm3(vec2(az * 80.0, y * 50.0));
  vec3 c1 = mix(uHillFar * 0.78, uHillFar * 1.05 + uSunColor * 0.015, lit1) * (0.94 + 0.12 * streak);
  c1 += uSunColor * vec3(1.0, 0.85, 0.7) * 0.035 * smoothstep(h1 - 0.005, h1, y) * lit1;  // warm sunlit rim
  c1 = mix(uHorizon, c1, 0.5 + 0.5 * smoothstep(0.0, 0.035, y));                          // base mist
  c1 = mix(c1, uHorizon, mh);
  col = mix(col, c1, a1 * 0.88);
  }
  float h2 = midH(az);
  if (h2 > 0.0) {
  float h2b = midH(az + 0.004);
  float lit2 = clamp(0.5 + (h2b - h2) * 70.0 * toSun, 0.0, 1.0);
  float a2 = smoothstep(h2 + 0.0006, h2 - 0.0006, y) * step(1e-4, h2);
  float rock = fbm3(vec2(az * 60.0, y * 90.0));
  vec3 c2 = uHill * mix(0.75, 1.15, lit2) * (0.9 + 0.2 * rock);
  c2 = mix(uHorizon * 0.95, c2, 0.5 + 0.5 * smoothstep(0.0, 0.02, y));
  c2 = mix(c2, uHorizon, mh * 0.85);
  col = mix(col, c2, a2);
  }
  float h3 = nearH(az);
  if (h3 > 0.0) {
  float a3 = smoothstep(h3 + 0.0005, h3 - 0.0005, y) * step(1e-4, h3);
  vec3 c3 = uHill * 0.62 * (0.9 + 0.2 * fbm3(vec2(az * 120.0, y * 200.0)));
  c3 = mix(uHorizon * 0.9, c3, 0.6 + 0.4 * smoothstep(0.0, 0.012, y));
  c3 = mix(c3, uHorizon, mh * 0.7);
  col = mix(col, c3, a3);
  }
  return col;
}

float caustic(vec2 p){
  float t = uTime * 0.55;
  vec2 q = p * 1.6;
  float a = vnoise(q + vec2(t, t * 0.7));
  float b = vnoise(q * 1.23 + vec2(-t * 0.8, t * 0.45) + 5.2);
  float v = abs(a - b);
  return pow(1.0 - smoothstep(0.0, 0.11, v), 2.0);
}
`;
</script>
<script>
/* ======================= Water ======================= */
const WATER_VERT = GLSL_COMMON + /* glsl */`
varying vec3 vWorld;
varying vec3 vNormal;
varying float vSince;
varying float vCrest;
varying float vS;
varying float vSeg;

vec3 gerstner(vec2 p, float ang, float wl, float a, float q, float t, inout float hsum){
  vec2 d = vec2(sin(ang), cos(ang));
  float k = 2.0 * PI / wl;
  float c = sqrt(9.8 / k);
  float f = k * (dot(d, p) - c * t);
  hsum += a * sin(f);
  return vec3(d.x * q * a * cos(f), a * sin(f), d.y * q * a * cos(f));
}

vec3 surface(vec2 p, out float since, out float crest, out float seg){
  float t = uTime;
  float s = p.y - shoreZ(p.x);
  float depth = max(-sandH(p), 0.0);
  float dd = mix(0.3, 1.0, clamp(depth / 2.5, 0.0, 1.0));
  float dist = length(p - cameraPosition.xz);
  float spacing = 0.017 * (dist + 6.0) + 0.08;
  float W = uWind;

  vec3 o = vec3(0.0);
  float hs = 0.0;
  float wl; float fade;
  wl = 31.0; fade = smoothstep(0.5, 0.25, spacing / wl); o += gerstner(p, 0.15, wl, 0.16 * W * dd * fade, 0.8, t, hs);
  wl = 19.0; fade = smoothstep(0.5, 0.25, spacing / wl); o += gerstner(p, -0.38, wl, 0.11 * W * dd * fade, 0.8, t * 1.03, hs);
  wl = 12.5; fade = smoothstep(0.5, 0.25, spacing / wl); o += gerstner(p, 0.62, wl, 0.07 * W * dd * fade, 0.9, t, hs);
  wl = 8.3;  fade = smoothstep(0.5, 0.25, spacing / wl); o += gerstner(p, -0.85, wl, 0.05 * W * dd * fade, 0.9, t * 0.97, hs);
  wl = 5.7;  fade = smoothstep(0.5, 0.25, spacing / wl); o += gerstner(p, 1.25, wl, 0.032 * W * dd * fade, 1.0, t, hs);
  wl = 3.9;  fade = smoothstep(0.5, 0.25, spacing / wl); o += gerstner(p, -0.1, wl, 0.022 * W * dd * fade, 1.0, t * 1.05, hs);
  wl = 2.6;  fade = smoothstep(0.5, 0.25, spacing / wl); o += gerstner(p, 2.1, wl, 0.013 * W * fade, 1.0, t, hs);
  wl = 1.8;  fade = smoothstep(0.5, 0.25, spacing / wl); o += gerstner(p, -1.6, wl, 0.009 * W * fade, 1.0, t, hs);
  crest = hs / (0.5 * W + 0.001);

  // shore-bound surf: long crests bent by surfPhi(x), shoaling then breaking near the beach
  vec2 nrm = normalize(vec2(-shoreSlope(p.x), 1.0));
  float th = KS * s - WS * t + surfPhi(p.x) + surfWarp(p);
  float wave = (PI * 0.5 - th) / (2.0 * PI);          // continuous: equals the crest index exactly on a crest
  float envBase = uSurf * smoothstep(-42.0, -9.0, s) * (1.0 - smoothstep(-3.6, -0.3, s));
  seg = surfSeg(p.x, wave);
  float env = envBase * (0.35 + 1.05 * seg) * (0.85 + 0.3 * vnoise(vec2(wave * 1.7, 7.3)));
  float cr = 0.5 + 0.5 * sin(th);
  o.y += env * pow(cr, 2.6) * 1.6 - envBase * 0.36;
  o.xz += nrm * env * 0.6 * cos(th - 0.5);
  since = fract((PI * 0.5 - th) / (2.0 * PI));
  crest += env * pow(cr, 3.0) * 2.2;

  // a weaker cross swell breaks up the parallel rhythm
  vec2 d2 = normalize(vec2(0.5, 1.0));
  float th2 = 0.82 * dot(d2, p) - 0.95 * t + 1.2 * vnoise(p * 0.07 + 9.0);
  float env2 = uSurf * 0.32 * smoothstep(-60.0, -12.0, s) * (1.0 - smoothstep(-5.0, -1.0, s));
  float cr2 = 0.5 + 0.5 * sin(th2);
  o.y += env2 * (cr2 * cr2 * 1.4 - 0.52);
  crest += env2 * cr2 * cr2;

  // blend into the swash sheet running up the beach; keep a little relief in it
  float b = smoothstep(-2.8, -0.2, s);
  if (b > 0.0) {
    float sp, sa;
    float L = swashLevel(p.x, sp, sa);
    o = mix(o, vec3(0.0, L + o.y * 0.18, 0.0), b);
  }
  crest *= (1.0 - b);
  return vec3(p.x + o.x, o.y, p.y + o.z);
}

void main(){
  vec2 p = (modelMatrix * vec4(position, 1.0)).xz;
  float dist = length(p - cameraPosition.xz);
  float e = 0.06 + dist * 0.004;
  float since, crest, seg, d1, d2, d3;
  vec3 P  = surface(p, since, crest, seg);
  vec3 Px = surface(p + vec2(e, 0.0), d1, d2, d3);
  vec3 Pz = surface(p + vec2(0.0, e), d1, d2, d3);
  vNormal = normalize(cross(Pz - P, Px - P));
  vWorld = P;
  vSince = since;
  vCrest = crest;
  vSeg = seg;
  vS = p.y - shoreZ(p.x);
  gl_Position = projectionMatrix * viewMatrix * vec4(P, 1.0);
}
`;

const WATER_FRAG = GLSL_COMMON + /* glsl */`
uniform vec3 uDeep;
uniform vec3 uShallow;
uniform vec3 uFogCol;
varying vec3 vWorld;
varying vec3 vNormal;
varying float vSince;
varying float vCrest;
varying float vS;
varying float vSeg;

// small wind waves; the domain warp keeps them from lining up into stripes
vec2 detailGrad(vec2 p, float dist){
  p += 1.1 * vec2(vnoise(p * 0.23 + uTime * 0.05), vnoise(p * 0.23 + 5.3 - uTime * 0.04));
  vec2 g = vec2(0.0);
  float ang = 0.3, wl = 1.7, a = 0.03;
  for (int i = 0; i < 11; i++){
    vec2 d = vec2(sin(ang), cos(ang));
    float k = 2.0 * PI / wl;
    float w = sqrt(9.8 * k);
    float f = k * dot(d, p) - w * uTime + float(i) * 1.7;
    float fade = 1.0 / (1.0 + dist * k * 0.006);
    if (a * k * fade * fade < 0.0004) break;
    g += d * (a * k * cos(f)) * fade * fade;
    ang += 2.39996; wl *= 0.77; a *= 0.79;
  }
  return g;
}

// Raindrop rings: each cell drops one ring at a random spot and moment; it spreads and fades.
vec2 rainGrad(vec2 p, float dist){
  vec2 g = vec2(0.0);
  float fade = exp(-dist / 35.0);
  if (fade < 0.02) return g;
  for (int l = 0; l < 2; l++){
    float fl = float(l);
    vec2 uv = p * (2.0 + fl * 1.4) + fl * 7.1;
    vec2 id = floor(uv);
    vec2 f = fract(uv) - 0.5;
    float r = hash12(id + fl * 2.7);
    float t = fract(uTime * (1.1 + 0.6 * r) + r * 10.0);
    vec2 c = (vec2(hash12(id + 3.1), hash12(id + 5.7)) - 0.5) * 0.5;
    vec2 dv = f - c;
    float d = length(dv) + 1e-4;
    float x = (d - t * 0.45) * 38.0;
    float env = exp(-x * x * 0.12) * (1.0 - t) * smoothstep(0.5, 0.3, d);
    g += (dv / d) * cos(x) * env * 0.5;
  }
  return g * fade;
}

// Sun sparkles. The surface is split into cells about the same size on screen near and far
// (stretched in depth to undo foreshortening). Each cell holds one tiny facet with a random
// tilt that is re-rolled every few tenths of a second; it flashes only when the tilted facet
// on the moving wave mirrors the sun into the eye.
float glints(vec3 P, vec3 N, vec3 V, vec3 Hh, float dist, vec2 fwP){
  float cell = 0.06 + dist * 0.0055;
  vec2 sc = vec2(cell, cell / sqrt(max(V.y, 0.04)));   // nearly square on the water: far glints lie flat
  float total = 0.0;
  for (int l = 0; l < 2; l++){
    float fl = float(l);
    vec2 uv = P.xz / (sc * (1.0 - 0.45 * fl)) + fl * 17.3;
    vec2 fw = max(fwP / (1.0 - 0.45 * fl), vec2(1e-4));   // cells per screen pixel (layer 2 is a scaled copy)
    vec2 id = floor(uv);
    vec2 f = fract(uv) - 0.5;
    float r1 = hash12(id + fl * 3.3);
    float cyc = uTime * (0.8 + 1.8 * r1) + r1 * 13.0;
    float life = fract(cyc);
    float epoch = floor(cyc);
    float r2 = hash12(id + epoch * 3.17 + 1.3);
    float r3 = hash12(id + epoch * 5.71 + 7.9);
    float r4 = hash12(id + epoch * 1.93 + 4.1);
    vec3 n = normalize(N + vec3(r2 - 0.5, 0.0, r3 - 0.5) * 0.26);
    float hit = smoothstep(0.9963, 0.9992, dot(n, Hh));
    vec2 off = (vec2(r3, r4) - 0.5) * 0.5;
    float rad = 0.09 + 0.14 * r4;
    // sized in screen pixels, so a glint on a steep wave face stays a small dot, not a streak
    float rpx = clamp(rad / fw.x, 0.7, 3.2);
    float spot = smoothstep(rpx, rpx * 0.35, length((f - off) / fw * vec2(1.0, 1.5)));
    float blink = smoothstep(0.0, 0.12, life) * smoothstep(1.0, 0.45, life);
    total += hit * spot * blink * (0.3 + 0.7 * r2) * (1.0 - 0.4 * fl);
  }
  return total;
}

void main(){
  vec3 P = vWorld;
  vec3 toC = cameraPosition - P;
  float dist = length(toC);
  vec3 V = toC / dist;
  float Hs = sandH(P.xz);
  float thick = P.y - Hs;
  // screen-space size of a glint cell, taken here in uniform control flow (same formula as in glints)
  float gCell = 0.06 + dist * 0.0055;
  vec2 fwP = fwidth(P.xz / vec2(gCell, gCell / sqrt(max(V.y, 0.04))));
  float s = vS;

  vec2 g = detailGrad(P.xz, dist) * (0.5 + 0.6 * uWind);
  if (uRain > 0.01) g += rainGrad(P.xz, dist) * uRain;
  g *= mix(0.3, 1.0, smoothstep(0.0, 0.3, thick));
  vec3 N = normalize(vec3(vNormal.x - g.x, vNormal.y, vNormal.z - g.y));
  float ndv = dot(N, V);
  if (ndv < 0.03) { N = normalize(N + V * (0.03 - ndv)); ndv = dot(N, V); }

  float shade = cloudShadow(P);
  vec3 R = reflect(-V, N); R.y = abs(R.y);
  float F = 0.02 + 0.98 * pow(1.0 - clamp(ndv, 0.0, 1.0), 5.0);
  vec3 refl = skyColor(R, dist < 260.0);
  refl = mountains(R, refl);

  // water body: clear turquoise in the shallows, deep blue offshore
  float depthMix = 1.0 - exp(-max(thick, 0.0) * 0.38);
  depthMix = max(depthMix, smoothstep(40.0, 400.0, dist) * 0.85);
  vec3 body = mix(uShallow, uDeep, depthMix);
  float sunUp = max(uSunDir.y, 0.0);
  vec3 amb = uZenith * 0.55 + uHorizon * 0.45;
  vec3 bodyLit = body * (amb + uSunColor * 0.32 * (0.35 + sunUp) * shade);
  // sunlight passing through the thin lip of rising waves
  float back = pow(clamp(dot(-V, uSunDir) * 0.5 + 0.5, 0.0, 1.0), 2.0);
  float sss = (0.35 + back) * clamp(vCrest, 0.0, 1.5) * shade;
  bodyLit += uShallow * uSunColor * sss * 0.3 * (1.0 - depthMix * 0.4);

  float path = max(thick, 0.0) / max(V.y, 0.1);
  float a = 1.0 - exp(-path * 0.36);
  a *= smoothstep(0.0, 0.025, thick);

  // ---------- sun on the water ----------
  vec3 Hh = normalize(V + uSunDir);
  float Fh = 0.02 + 0.98 * pow(1.0 - max(dot(V, Hh), 0.0), 5.0);
  float sunVis = shade * smoothstep(0.0, 0.03, thick) * smoothstep(-0.02, 0.05, uSunDir.y);
  // a soft underlying sheen, kept dim so it never reads as one solid band
  float shin = mix(900.0, 70.0, smoothstep(6.0, 320.0, dist));
  float sheen = pow(max(dot(N, Hh), 0.0), shin) * (shin + 8.0) / (8.0 * PI);
  vec3 specC = uSunColor * min(sheen * Fh, 6.0) * 0.28 * sunVis;
  // sparkles: tiny facets on the wave faces catch the sun for a moment, then vanish
  // a facet can only flash near the mirror direction (tilt ≤ 0.13 rad), so skip the rest
  float gl = 0.0;
  if (dot(N, Hh) > 0.95 && sunVis > 0.001) gl = glints(P, N, V, Hh, dist, fwP);
  vec3 glintC = uSunColor * gl * Fh * 60.0 * sunVis * (1.0 - 0.9 * uRain) * smoothstep(0.06, 0.25, thick);

  float edgeFade = smoothstep(0.0, 0.03, thick);
  vec3 col = bodyLit * a * (1.0 - F) + refl * F * edgeFade + specC;
  float alpha = clamp(a * (1.0 - F) + F * edgeFade, 0.0, 1.0);

  // ---------- foam: breaking crests, the bore running up, lace left by the backwash ----------
  float sp = 0.5, sa = uRun, L = 0.0;
  if (s > -13.0) L = swashLevel(P.x, sp, sa) * smoothstep(-13.0, -11.0, s);
  float since = vSince;
  float bz = smoothstep(-6.0, -3.0, s) * (1.0 - smoothstep(-0.2, 1.2, s));
  float bar = exp(-sq((s + 7.5) / 1.8)) * smoothstep(0.3, 0.8, uSurf) * 0.6;
  float big = 0.3 + 0.95 * vSeg;
  float breakF = (bz + bar * big) * big * (exp(-since * 6.0) * 1.5 + exp(-since * 1.8) * 0.6);
  // whitewater left behind: drifting, patchy streaks across the surf zone
  float residual = smoothstep(-10.0, -4.5, s) * (1.0 - smoothstep(-0.6, 0.6, s))
                 * (0.3 + 0.35 * vSeg) * (0.6 + 0.4 * smoothstep(0.2, 0.9, since));
  // the running edge: strong where a big wave arrives, patchy and broken elsewhere
  float runE = clamp(sa / max(uRun, 0.01), 0.3, 1.6);
  float alongX = vnoise(vec2(P.x * 0.45 + sa * 23.0, 0.5)) * 0.7 + vnoise(vec2(P.x * 1.7, sa * 11.0)) * 0.3;
  float edgeMask = 0.45 + 0.8 * alongX;
  float edge = (1.0 - smoothstep(0.0, 0.07, thick)) * smoothstep(-1.8, -0.2, s) * edgeMask * (0.45 + 0.4 * runE);
  float rising = 1.0 - smoothstep(0.08, 0.35, sp);
  float swashF = edge * (0.4 + 0.6 * rising)
               + smoothstep(-0.8, 0.4, s) * (1.0 - smoothstep(0.0, 0.16, thick)) * 0.32 * (1.0 - sp) * edgeMask;
  float wc = smoothstep(0.6, 1.0, vCrest) * smoothstep(1.0, 1.45, uWind) * (1.0 - bz) * (1.0 - smoothstep(80.0, 250.0, dist));
  float fAmt = clamp((breakF + swashF + residual + wc * 0.7) * uFoam, 0.0, 0.94);
  float foam = 0.0, lace = 0.5;
  if (fAmt > 0.01){
    vec2 fuv = P.xz * vec2(1.2, 1.8) + vec2(0.0, -L * 6.0 + since * 2.2);
    fuv += 0.7 * vec2(vnoise(fuv * 0.35), vnoise(fuv * 0.35 + 3.0));
    lace = fbm(fuv * 1.3 + uTime * 0.04) * 0.62 + fbm3(fuv * 4.3 - uTime * 0.07) * 0.38;
    foam = smoothstep(1.0 - fAmt, 1.0 - fAmt + 0.12, lace);
    float holes = smoothstep(0.24, 0.48, fbm3(fuv * 2.6 + 7.0 + since));
    foam *= mix(holes, 1.0, fAmt * 0.55);
    foam *= smoothstep(-0.005, 0.012, thick);
    foam *= 1.0 - smoothstep(120.0, 400.0, dist) * 0.7;
    foam *= 0.94;
  }
  vec3 foamCol = (uSunColor * (0.2 + max(dot(N, uSunDir), 0.0)) * shade * 0.7 + amb * 0.95) * (0.74 + 0.26 * lace);
  col = col * (1.0 - foam) + foamCol * foam;
  alpha = alpha * (1.0 - foam) + foam;
  col += glintC * (1.0 - foam) * (1.0 - fAmt * 0.6);   // glints only on open water, never on foam

  // aerial haze toward the horizon
  float hz = 1.0 - exp(-dist * uHaze * 1.35);
  col = col * (1.0 - hz) + uFogCol * hz * alpha;
  gl_FragColor = vec4(col, alpha);
}
`;

void main(){

}

const SKY_FRAG = GLSL_COMMON + /* glsl */`
uniform float uRays;
uniform float uCirrus;
uniform sampler2D tClouds;
uniform vec2 uCloudTexel;
uniform vec2 uScreen;
uniform vec2 uSunUV;
uniform float uSunOn;
varying vec3 vDir;
void main(){
  vec3 d = normalize(vDir);
  vec3 col = skyBase(d);
  float sd = max(dot(d, uSunDir), 0.0);
  if (d.y > 0.0){
    // high wispy cirrus behind everything, catching the colour of the light
    vec2 cuv = d.xz / (d.y + 0.12) * vec2(0.7, 2.6) + uWindOff * vec2(0.5, 0.2);
    float ci = fbm3(cuv * 1.2 + vec2(fbm3(cuv * 0.45) * 1.8, 0.0));
    ci = smoothstep(0.58, 0.95, ci) * smoothstep(0.02, 0.2, d.y) * uCirrus;
    col = mix(col, uCloudLit * 1.05 + uSunColor * 0.25 * pow(sd, 3.0), ci * 0.4);

  float sunDisc = 14.0 * smoothstep(0.99975, 0.9999, sd);
  // volumetric clouds, rendered at lower resolution: rgb premultiplied, a = coverage
  vec2 suv = gl_FragCoord.xy / uScreen;
  vec4 cl = 0.25 * (texture2D(tClouds, suv + uCloudTexel * vec2(0.6, 0.6)) + texture2D(tClouds, suv + uCloudTexel * vec2(-0.6, 0.6))
                  + texture2D(tClouds, suv + uCloudTexel * vec2(0.6, -0.6)) + texture2D(tClouds, suv + uCloudTexel * vec2(-0.6, -0.6)));
  col = col * (1.0 - cl.a) + cl.rgb;
  col += uSunColor * sunDisc * pow(1.0 - cl.a, 3.0);   // the disc only shows through thin cloud
  // sun shafts through the gaps, traced on screen toward the sun
  if (uRays > 0.01 && uSunOn > 0.5 && sd > 0.6){
    vec2 toS = uSunUV - suv;
    float acc = 0.0;
    for (int i = 0; i < 12; i++){
      vec2 s = suv + toS * ((float(i) + 0.5) / 12.0);
      acc += 1.0 - texture2D(tClouds, clamp(s, 0.0, 1.0)).a;

    col += uSunColor * uRays * 0.1 * acc * pow(sd, 6.0) * (1.0 - cl.a * 0.5) * smoothstep(0.0, 0.08, d.y);

  col = mix(col, uHorizon * 0.95, uRain * 0.4 * (1.0 - smoothstep(0.0, 0.18, d.y)));
  col = mountains(d, col);
  if (d.y < 0.0) col = mix(col, uHorizon * 0.95, smoothstep(0.0, -0.002, d.y));   // matches the sea haze
  gl_FragColor = vec4(col, 1.0);

`;

/* ======================= Volumetric clouds ======================= */
// Ray-marched through a real layer above the sea. Cumulus shape: a flat base and a rounded
// crown from a height gradient, cells from the cover map, billows carved by a tiling 3D
// Perlin-Worley texture. Each sample looks toward the sun to find how much cloud shades it.
// The camera never moves, so every frame is blended with the previous one using a fresh
// random ray offset: the noise averages away and edges come out smooth.
const CLOUD_FRAG = GLSL_COMMON + /* glsl */`
precision highp sampler3D;
uniform sampler3D tNoise;
uniform sampler2D tPrev;
uniform float uBlend;
uniform float uFrame;
uniform vec2 uTexel;
uniform mat4 uInvProj;
uniform mat4 uCamWorld;
uniform vec3 uCamPos;
varying vec2 vUv;

float remap(float v, float a, float b, float c, float d){ return c + (v - a) / (b - a) * (d - c); }
float cloudDensity(vec3 p, bool detail){
  float cov = coverage(p.xz);
  if (cov < 0.01) return 0.0;
  float h = (p.y - CLOUD_BASE) / (CLOUD_TOP - CLOUD_BASE);
  // how tall this cloud grows comes from its own slow noise, not from the cover
  vec2 tq = (p.xz + uCloudOff) / 23000.0;
  float tower = texture2D(tCover, tq + 0.53).r;
  float topH = mix(0.35, 1.0, smoothstep(0.15, 0.7, tower) * (0.6 + 0.4 * uBank));
  float hr = h / topH;
  float grad = smoothstep(0.0, 0.06, h) * (1.0 - smoothstep(0.35, 1.0, hr));
  if (grad < 0.01) return 0.0;
  vec3 q = (p + vec3(uCloudOff.x, 0.0, uCloudOff.y)) * 0.00031;
  float shape = texture(tNoise, q).r;
  float dens = clamp(remap(shape * grad, 1.0 - cov, 1.0, 0.0, 1.0), 0.0, 1.0) * cov;
  if (detail && dens > 0.0){
    float det = texture(tNoise, q * 3.2 + vec3(0.0, uTime * 0.002, 0.0)).g;
    dens = clamp(remap(dens, det * 0.24 * (1.0 - hr * 0.3), 1.0, 0.0, 1.0), 0.0, 1.0);
  }
  return dens;
}
float hg(float c, float g){
  float g2 = g * g;
  return (1.0 - g2) / pow(1.0 + g2 - 2.0 * g * c, 1.5);   // isotropic = 1
}
void main(){

  // per-pixel offsets that walk a low-discrepancy sequence frame by frame, so the average converges fast
  float base = hash12(gl_FragCoord.xy);
  float n1 = fract(base + uFrame * 0.6180340);
  float n2 = fract(hash12(gl_FragCoord.xy + 17.7) + uFrame * 0.7548777);
  float n3 = fract(hash12(gl_FragCoord.xy + 41.3) + uFrame * 0.5698403);
  vec2 ndc = (vUv + (vec2(n2, n3) - 0.5) * uTexel) * 2.0 - 1.0;   // sub-pixel jitter
  vec4 v = uInvProj * vec4(ndc, 1.0, 1.0);
  v /= v.w;
  vec3 rd = normalize((uCamWorld * vec4(v.xyz, 0.0)).xyz);
  vec4 cur = vec4(0.0);
  if (rd.y > 0.004){
    vec3 ro = uCamPos;
    float t0 = (CLOUD_BASE - ro.y) / rd.y;
    float t1 = (CLOUD_TOP - ro.y) / rd.y;
    const int STEPS = 72;
    float dt = min((t1 - t0) / float(STEPS), 250.0);
    float t = t0 + dt * n1;
    float mu = dot(rd, uSunDir);
    float phase = min(mix(hg(mu, -0.25), hg(mu, 0.72), 0.5), 4.0);
    const float SIGMA = 0.03;
    vec3 warm = uSunColor * vec3(1.0, 0.92, 0.82);
    vec3 col = vec3(0.0);
    float T = 1.0;
    for (int i = 0; i < STEPS; i++){
      vec3 p = ro + rd * t;
      if (p.y > CLOUD_TOP || t > 60000.0) break;
      float dens = cloudDensity(p, true);
      if (dens > 0.003){
        float ld = 0.0;
        ld += cloudDensity(p + uSunDir * 50.0, false) * 100.0;
        ld += cloudDensity(p + uSunDir * 180.0, false) * 170.0;
        ld += cloudDensity(p + uSunDir * 400.0, false) * 280.0;
        ld += cloudDensity(p + uSunDir * 800.0, false) * 500.0;
        float beer = exp(-ld * SIGMA) + 0.18 * exp(-ld * SIGMA * 0.25);
        float powder = 1.0 - exp(-dens * 6.0);
        float hN = clamp((p.y - CLOUD_BASE) / (CLOUD_TOP - CLOUD_BASE), 0.0, 1.0);
        vec3 amb = mix(uCloudDark * 0.55, uCloudLit * 0.32 + uZenith * 0.22, smoothstep(0.0, 0.6, hN));
        vec3 S = warm * beer * phase * mix(0.5, 1.0, powder) * 0.72 + amb;
        float haze = 1.0 - exp(-t * 0.000022 * (1.0 + 4.0 * uRain));
        S = mix(S, uHorizon, haze);
        float ext = exp(-dens * SIGMA * dt);
        col += T * (1.0 - ext) * S;
        T *= ext;
        if (T < 0.02) break;
      }
      t += dt;
    }
    cur = vec4(col, 1.0 - T);
  }
  vec4 prev = texture2D(tPrev, vUv);
  gl_FragColor = mix(prev, cur, uBlend);
}
`;

const COMPOSITE_FRAG = /* glsl */`
uniform sampler2D tScene; uniform sampler2D tB1; uniform sampler2D tB2;
uniform float uExposure; uniform vec3 uGrade; uniform float uTime;
varying vec2 vUv;
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

function makeGull() {

  const bill = new THREE.Group(); bill.position.set(0, -0.01, 0.05); head.add(bill);
  add(bill, M.billGeo, M.bill, 0, 0, 0.035);

    const armM = new THREE.Group(); armM.scale.x = sd; shoulder.add(armM);
    add(armM, M.armGeo, M.under);
    add(armM, M.armGeo, M.greyTop, 0, 0.003, 0);
    const wrist = new THREE.Group(); wrist.position.x = sd * 0.34; shoulder.add(wrist);
    const handM = new THREE.Group(); handM.scale.x = sd; wrist.add(handM);
    add(handM, M.handGeo, M.under);
    add(handM, M.handGeo, M.greyTop, 0, 0.003, 0);
    add(handM, M.tipGeo, M.blackTop, 0, 0.0045, 0);
    add(handM, M.tipGeo, M.blackUnder, 0, -0.0015, 0);

  const legs = new THREE.Group(); legs.position.set(0, -0.05, -0.03); body.add(legs);

    const hip = new THREE.Group(); hip.position.x = sd * 0.028; legs.add(hip);
    add(hip, M.thighGeo, M.leg);
    const knee = new THREE.Group(); knee.position.y = -0.06; hip.add(knee);
    add(knee, M.shankGeo, M.leg);
    const ankle = new THREE.Group(); ankle.position.y = -0.075; knee.add(ankle);
    add(ankle, M.footGeo, M.leg);

// One pose from a handful of intentions. ph = wingbeat phase, amp = stroke size, lift = how high

function poseGull(G, o) {
  const s = Math.sin(o.ph + 0.3 * Math.sin(o.ph));       // quicker downstroke, slower recovery
  const up = Math.max(0, Math.cos(o.ph));                // recovery stroke: the hand folds in
  for (const w of G.wings) {
    const sd = w.sd;
    w.shoulder.rotation.set(0.05 * o.amp * Math.cos(o.ph), sd * -0.12 * o.amp * Math.cos(o.ph), sd * (o.lift + o.amp * s));
    const fold = clamp(o.fold + o.amp * 0.75 * up, 0, 1);

  G.tail.rotation.x = -0.25 * (o.spread || 0);
  G.head.rotation.x = (o.headPitch || 0) - 0.6 * (o.bodyPitch || 0) - 0.5 * (o.rootPitch || 0);

// Heading, pitch and bank all ease toward targets: nothing is ever set outright, so nothing snaps.
function steerGull(dt, dir, attitude, holdHeading) {

           pose: { ph: 0, amp: 0.05, lift: 0.14, fold: 0.15, legs: 0, spread: 0, headPitch: 0, bodyPitch: 0, rootPitch: 0 } };

function updateFarGulls(dt, T) {

const smoothT = (t) => t * t * (3 - 2 * t);
function stretch(arr) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < arr.length; i++) { if (arr[i] < lo) lo = arr[i]; if (arr[i] > hi) hi = arr[i]; }

// 2D cover map: tiling value-noise fbm, stretched to the full 0..1 range
function makeCoverTexture() {
  const N = 256;
  const octs = [[4, 0.5], [8, 0.26], [16, 0.14], [32, 0.1]].map(([P, w]) => {
    const L = new Float32Array(P * P); for (let i = 0; i < L.length; i++) L[i] = Math.random();
    return { P, w, L };
  });
  const v = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let s = 0;
    for (const o of octs) {
      const X = x / N * o.P, Y = y / N * o.P;
      const xi = Math.floor(X), yi = Math.floor(Y), fx = smoothT(X - xi), fy = smoothT(Y - yi);
      const x0 = xi % o.P, x1 = (xi + 1) % o.P, y0 = yi % o.P, y1 = (yi + 1) % o.P;
      const a = o.L[y0 * o.P + x0], b = o.L[y0 * o.P + x1], c = o.L[y1 * o.P + x0], d = o.L[y1 * o.P + x1];
      s += o.w * ((a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy);
    }

  }

  for (let i = 0; i < N * N; i++) { const b = Math.round(v[i] * 255); data[i * 4] = data[i * 4 + 1] = data[i * 4 + 2] = b; data[i * 4 + 3] = 255; }

function makeNoise3D() {

  const value = (o, x, y, z) => {
    const s = o.P / N, P = o.P, L = o.L;
    const X = x * s, Y = y * s, Z = z * s;
    const xi = Math.floor(X), yi = Math.floor(Y), zi = Math.floor(Z);
    const fx = smoothT(X - xi), fy = smoothT(Y - yi), fz = smoothT(Z - zi);
    const x0 = xi % P, x1 = (xi + 1) % P, y0 = yi % P, y1 = (yi + 1) % P, z0 = zi % P, z1 = (zi + 1) % P;
    const at = (a, b, c) => L[(c * P + b) * P + a];
    const l = (a, b, t) => a + (b - a) * t;
    return l(l(l(at(x0, y0, z0), at(x1, y0, z0), fx), l(at(x0, y1, z0), at(x1, y1, z0), fx), fy),

  };

    const C = w.C, cs = N / C;

    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const ix = cx + dx, iy = cy + dy, iz = cz + dz;
      const wx = (ix + C) % C, wy = (iy + C) % C, wz = (iz + C) % C;
      const k = ((wz * C + wy) * C + wx) * 3;
      const ex = ix + w.pts[k] - fx, ey = iy + w.pts[k + 1] - fy, ez = iz + w.pts[k + 2] - fz;

  U.uWindOff.value.y += dt * 0.006 * W.wind;
  U.uCloudOff.value.x -= dt * (5 + 7 * W.wind);     // clouds drift left to right, metres per second
  U.uCloudOff.value.y -= dt * (1.5 + 2 * W.wind);
  sun.position.copy(sunTarget.position).addScaledVector(sd, 60);
  sun.color.copy(W.sun);
  sun.intensity = W.sunI * smooth(W.elev / 6);
  hemi.color.copy(W.zen).lerp(W.hor, 0.55);
  hemi.groundColor.copy(U.uSandA.value).multiply(W.sun).multiplyScalar(0.55);
  hemi.intensity = 0.95;
  scene.fog.color.copy(W.hor);
  scene.fog.density = W.haze * 1.1;
  compMat.uniforms.uExposure.value = W.exp;
  compMat.uniforms.uGrade.value.copy(W.grade);
  const shownName = manual.on ? STATES[manual.target].name : W.name;
  if (shownName !== moodShown) {
    moodShown = shownName;
    moodNameEl.style.opacity = '0';
    setTimeout(() => { moodNameEl.textContent = moodShown; moodNameEl.style.opacity = '1'; }, 600);
  }
}

/* ======================= Manual weather ======================= */
// Click the mood name for the next mood; clicking past the last one hands control back to the cycle.
const moodNameEl = document.getElementById('moodName');
const moodModeEl = document.getElementById('moodMode');
let WT = 0;   // weather clock, separate from the animation clock so waves never jump
function setWeather(i) {
  const n = STATES.length;
  manual.from = snapshotWeather();
  manual.target = ((i % n) + n) % n;
  manual.k = 0;
  manual.on = true;
  manual.release = false;
  moodModeEl.textContent = '手动';
  // show the destination right away rather than waiting for the blend midpoint
  moodShown = STATES[manual.target].name;
  moodNameEl.textContent = moodShown;
  moodNameEl.style.opacity = '1';
}
function autoWeather() {
  if (!manual.on) return;
  // finish any blend in progress, then the cycle resumes from the start of this mood
  manual.release = true;
  moodModeEl.textContent = '';
}
function currentIndex() {
  if (manual.on) return manual.target;
  return Math.floor(WT / SEG) % STATES.length;
}
moodEl.addEventListener('click', () => {
  if (manual.on && !manual.release && manual.target === STATES.length - 1) autoWeather();
  else setWeather(currentIndex() + 1);
});

/* ======================= Input ======================= */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hintTimer = null;
function groundHit(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, d = ray.ray.direction;
  const p = new THREE.Vector3();
  for (let t = 0.5; t < 90; t += 0.2) {
    p.copy(o).addScaledVector(d, t);
    if (p.y <= Math.max(sandH(p.x, p.z), 0)) return p;
  }
  return new THREE.Vector3(0, sandH(0, 9), 9);
}
canvas.addEventListener('pointerdown', (ev) => {
  if (gull.state !== 'idle') return;

    hintEl.textContent = '地上暂时没有薯条了，等路人再掉一根。';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { hintEl.textContent = HINT; }, 3200);

/* ======================= Sound ======================= */
// Everything you hear is synthesised live with Web Audio, so there is nothing to download:
// surf that follows the swash on screen, wind and rain that follow the weather, gulls and their
// wing beats, footsteps, fries landing, a far-off horn, and a soft generative score underneath.
// Browsers only allow audio after a gesture, so it starts on the first tap; the corner button mutes.
const sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const btn = document.getElementById('sound');
  const btnLabel = document.getElementById('soundLabel');
  let muted = false;
  try { muted = localStorage.getItem('dockFriesMuted') === '1'; } catch (e) {}
  function showState() {
    btnLabel.textContent = muted ? '声音 关' : '声音 开';
    btn.setAttribute('aria-pressed', muted ? 'false' : 'true');
  }
  showState();
  if (!AC) { btn.hidden = true; return { update() {} }; }

  let ctx = null, master, sfxBus, ambBus, musBus, verbIn, noiseBuf, brownBuf, rumble, wind, rain;
  let startedAt = -1e9, failed = false;
  const surfVoices = [];

  /* ---- the swash, mirrored from the shaders so each crash lands with the wave on screen ---- */
  const fract = (x) => x - Math.floor(x);
  function hash12(x, y) {
    let a = fract(x * 0.1031), b = fract(y * 0.1031), c = a;
    const d = a * (b + 33.33) + b * (c + 33.33) + c * (a + 33.33);
    a += d; b += d; c += d;
    return fract((a + b) * c);
  }
  function vnoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return lerp(lerp(hash12(ix, iy), hash12(ix + 1, iy), ux), lerp(hash12(ix, iy + 1), hash12(ix + 1, iy + 1), ux), uy);
  }
  function swash(x, t) {
    const z = shoreZ(x);
    const th0 = 0.9 * Math.sin(0.045 * x + 0.3) + 0.5 * Math.sin(0.13 * x + 1.7) + 0.25 * Math.sin(0.31 * x + 4.0)
              + 1.4 * vnoise(x * 0.055, z * 0.055) + 0.55 * vnoise(x * 0.14 + 4.0, z * 0.14 + 4.0);
    const v = (Math.PI * 0.5 + 0.8378 * t - th0) / TAU;
    const n = Math.floor(v);
    const size = (0.45 + 0.95 * vnoise(x * 0.09 + n * 3.7, n * 1.3)) * (0.88 + 0.24 * vnoise(x * 0.55, n * 2.1));
    return { p: v - n, size };
  }

  /* ---- building blocks ---- */
  const gain = (v, to) => { const g = ctx.createGain(); g.gain.value = v; if (to) g.connect(to); return g; };
  const filter = (type, f, q, to) => {
    const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f;
    if (q !== undefined) b.Q.value = q;
    if (to) b.connect(to);
    return b;
  };
  // stereo placement; falls back to a plain pass-through where StereoPannerNode is missing
  const panner = (p, to) => {
    if (!ctx.createStereoPanner) return to;
    const s = ctx.createStereoPanner(); s.pan.value = clamp(p, -1, 1); s.connect(to); return s;
  };
  function makeNoise(sec, brown) {
    const len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
    }
    return buf;
  }
  function makeImpulse(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function loop(buf, to) {
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
    s.connect(to); s.start(0, Math.random() * buf.duration);
    return s;
  }
  // a short burst of filtered noise with a quick envelope: steps, wings, thuds, snatches, drops
  function burst(t, dur, type, freq, q, vol, pan, wet) {
    if (vol < 1e-4) return;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const g = gain(0);
    src.connect(filter(type, freq, q, g));
    g.connect(panner(pan, sfxBus));
    if (wet) g.connect(gain(wet, verbIn));
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.012, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.start(t, Math.random() * (noiseBuf.duration - dur - 0.1));
    src.stop(t + dur + 0.02);
  }
  function tone(t, dur, type, f0, f1, vol, pan, wet, to) {
    if (vol < 1e-4) return;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = gain(0);
    o.connect(g); g.connect(panner(pan, to || sfxBus));
    if (wet) g.connect(gain(wet, verbIn));
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  }

  /* ---- where things are: pan from the screen position, level from the distance ---- */
  const pt = new THREE.Vector3();
  const panOf = (p) => { pt.copy(p).project(camera); return clamp(pt.x * 0.9, -1, 1); };
  const near = (p) => 1 / (1 + p.distanceTo(camera.position) / 12);

  /* ---- effects ---- */
  function gullNote(t, dur, f0, fPeak, fEnd, vol, pan, far) {
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.linearRampToValueAtTime(fPeak, t + dur * 0.3);
    o.frequency.linearRampToValueAtTime(fEnd, t + dur);
    const lfo = ctx.createOscillator(); lfo.frequency.value = rand(22, 34);   // the rasp in the voice
    const lg = gain(fPeak * 0.025); lfo.connect(lg); lg.connect(o.frequency);
    const out = gain(0);
    o.connect(filter('bandpass', 1500, 2.5, out));
    o.connect(filter('bandpass', 2900, 3.5, gain(0.6, out)));
    const lp = filter('lowpass', far ? 2200 : 6500, 0.5);
    out.connect(lp); lp.connect(panner(pan, sfxBus));
    lp.connect(gain(far ? 0.8 : 0.25, verbIn));
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(vol, t + 0.025);
    out.gain.setValueAtTime(vol, t + dur * 0.6);
    out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  }
  // 'long' is the two-part "kyow… kyow", 'laugh' the quick ha-ha-ha, 'chirp' a single short note
  function gullCall(pos, kind, far) {
    const t = ctx.currentTime + 0.02;
    const pan = panOf(pos), vol = (far ? 0.45 : 1) * clamp(near(pos) * 2.4, 0.2, 1) * 1.5;
    const offsets = kind === 'laugh' ? [0, 0.19, 0.37, 0.54].slice(0, 2 + Math.floor(Math.random() * 3))
                  : kind === 'chirp' ? [0] : [0, rand(0.5, 0.65)];
    offsets.forEach((d, i) => {
      const dur = kind === 'long' ? rand(0.4, 0.52) : rand(0.13, 0.17);
      const base = rand(620, 760) * (kind === 'chirp' ? 1.25 : 1);
      gullNote(t + d, dur, base, base * 1.55, base * 0.85, vol * (i ? 0.85 : 1), pan, far);
    });
  }
  function flap(pos, amp) {
    burst(ctx.currentTime + 0.01, 0.13, 'bandpass', rand(480, 760), 0.8, 0.5 * amp * clamp(near(pos) * 2, 0.1, 1), panOf(pos), 0.08);
  }
  function step(pos, soft) {
    const wet = W.rain > 0.3;
    burst(ctx.currentTime + 0.005, 0.09, 'bandpass', wet ? rand(560, 720) : rand(1100, 1500), 0.9, 0.32 * soft * near(pos), panOf(pos), 0.02);
  }
  function thud(pos, s) {
    const t = ctx.currentTime + 0.005, pan = panOf(pos), v = s * near(pos);
    burst(t, 0.07, 'lowpass', 900, 0.7, 0.35 * v, pan, 0);
    tone(t, 0.06, 'sine', 210, 120, 0.12 * v, pan, 0);
  }
  function snatch(pos) {
    const t = ctx.currentTime + 0.005, pan = panOf(pos), v = near(pos);
    burst(t, 0.05, 'highpass', 2500, 0.7, 0.3 * v, pan, 0.05);
    burst(t + 0.07, 0.04, 'highpass', 3200, 0.7, 0.2 * v, pan, 0);
  }
  function horn(pos) {
    const t = ctx.currentTime + 0.05, pan = panOf(pos);
    [[0, 2.6], [3.6, 1.6]].forEach(([d, len]) => {
      const out = gain(0);
      const lp = filter('lowpass', 460, 0.8, out);
      out.connect(panner(pan, sfxBus)); out.connect(gain(1.4, verbIn));
      [98, 123.5].forEach((f) => [-6, 6].forEach((det) => {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        o.connect(lp); o.start(t + d); o.stop(t + d + len + 1.4);
      }));
      out.gain.setValueAtTime(0, t + d);
      out.gain.linearRampToValueAtTime(0.06, t + d + 0.4);
      out.gain.setValueAtTime(0.06, t + d + len);
      out.gain.exponentialRampToValueAtTime(0.0001, t + d + len + 1.2);
    });
  }

  /* ---- music: slow pads under a sparse, wandering pentatonic melody ---- */
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [
    [50, 57, 61, 64, 66],   // Dmaj9
    [47, 54, 62, 64, 69],   // Bm11
    [43, 50, 59, 62, 66],   // Gmaj7
    [45, 52, 59, 61, 64],   // Asus2(add6)
  ];
  const SCALE = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83];   // D major pentatonic
  const STEP = 1.2, STEPS_PER_CHORD = 8;
  let nextStep = 0, stepN = 0, melody = 4;
  function pad(t, chord, dur, bright) {
    const out = gain(0);
    const lp = filter('lowpass', bright, 0.4, out);
    out.connect(musBus); out.connect(gain(0.6, verbIn));
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(1, t + 3.2);
    out.gain.setValueAtTime(1, t + dur);
    out.gain.linearRampToValueAtTime(0, t + dur + 3.5);
    chord.forEach((m, i) => [-4, 4].forEach((det) => {
      const o = ctx.createOscillator();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = mtof(m); o.detune.value = det;
      o.connect(gain(i === 0 ? 0.05 : 0.022, lp));
      o.start(t); o.stop(t + dur + 3.7);
    }));
  }
  function pluck(t, m, vol) {
    const f = mtof(m), pan = rand(-0.35, 0.35);
    tone(t, 2.2, 'sine', f, f, vol, pan, 0.5, musBus);
    tone(t, 0.9, 'sine', f * 2, f * 2, vol * 0.25, pan, 0.3, musBus);
    tone(t, 0.35, 'triangle', f * 3, f * 3, vol * 0.08, pan, 0, musBus);
  }
  function scheduleMusic() {
    const now = ctx.currentTime;
    if (nextStep < now) nextStep = now + 0.05;
    const dusk = smooth((9 - W.elev) / 4);
    while (nextStep < now + 0.4) {
      const k = stepN % STEPS_PER_CHORD;
      if (k === 0) {
        const chord = CHORDS[Math.floor(stepN / STEPS_PER_CHORD) % CHORDS.length];
        pad(nextStep, chord, STEP * STEPS_PER_CHORD, 1300 - 450 * W.rain - 350 * dusk);
      }
      // fewer notes in the rain, a little lower at dusk
      const density = 0.42 - 0.2 * W.rain - 0.08 * dusk;
      if (k !== 0 && Math.random() < density) {
        melody = clamp(melody + Math.round(rand(-2.4, 2.4)), 0, SCALE.length - 1);
        let m = SCALE[melody];
        if (dusk > 0.5 && Math.random() < 0.4) m -= 12;
        pluck(nextStep + (k % 2) * 0.06, m, 0.05 * (0.7 + 0.3 * Math.random()));
        if (Math.random() < 0.15) pluck(nextStep + STEP * 0.5, SCALE[clamp(melody + 1, 0, SCALE.length - 1)], 0.03);
      }
      nextStep += STEP;
      stepN++;
    }
  }

  /* ---- graph ---- */
  function build() {
    ctx = new AC();
    noiseBuf = makeNoise(3, false);
    brownBuf = makeNoise(5, true);
    master = gain(muted ? 0 : 1);
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3;
    master.connect(comp); comp.connect(gain(1.4, ctx.destination));
    const verb = ctx.createConvolver(); verb.buffer = makeImpulse(3.4, 2.4);
    verbIn = gain(1, verb); verb.connect(gain(0.55, master));
    sfxBus = gain(1.2, master);
    ambBus = gain(0, master); ambBus.gain.setTargetAtTime(0.85, ctx.currentTime, 1.2);
    musBus = gain(0, master); musBus.gain.setTargetAtTime(0.5, ctx.currentTime + 1.5, 3);
    // low sea rumble under everything
    rumble = gain(0.1, ambBus);
    loop(brownBuf, filter('lowpass', 260, 0.5, rumble));
    // three stretches of surf across the beach, each following the swash in front of it
    [-7, 0, 7].forEach((x, i) => {
      const g = gain(0);
      const pn = panner(0, ambBus);
      g.connect(pn); g.connect(gain(0.25, verbIn));
      const f = filter('lowpass', 800, 0.6, g);
      loop(noiseBuf, f);
      surfVoices.push({ x, g, f, pn, w: i === 1 ? 1 : 0.8 });
    });
    // wind: a moving band of noise
    const wg = gain(0), wp = panner(0, ambBus);
    wg.connect(wp);
    const wf = filter('bandpass', 500, 1.1, wg);
    loop(noiseBuf, wf);
    wind = { g: wg, f: wf, p: wp };
    // rain: a bright hiss; single drops are added in update()
    const rg = gain(0, ambBus);
    loop(noiseBuf, filter('highpass', 1600, 0.5, filter('lowpass', 7500, 0.5, rg)));
    rain = { g: rg };
    nextStep = ctx.currentTime + 0.5;
    moodEl.addEventListener('click', () => {
      if (ctx.state === 'running') tone(ctx.currentTime, 0.07, 'sine', 1400, 900, 0.08, 0, 0.1);
    });
  }
  function start() {
    if (failed) return;
    if (!ctx) {
      try { build(); } catch (e) {
        // no sound rather than a half-built graph erroring every frame
        failed = true; btn.hidden = true;
        if (ctx) ctx.close();
        ctx = null;
        return;
      }
      startedAt = performance.now();
    }
    if (!muted && ctx.state !== 'running') ctx.resume();
  }
  ['pointerdown', 'keydown', 'touchend'].forEach((ev) => window.addEventListener(ev, start, { capture: true, passive: true }));
  btn.addEventListener('click', () => {
    if (!ctx) return;
    if (performance.now() - startedAt < 500) return;   // this press is what switched the sound on
    muted = !muted;
    master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.12);
    if (!muted && ctx.state !== 'running') ctx.resume();
    try { localStorage.setItem('dockFriesMuted', muted ? '1' : '0'); } catch (e) {}
    showState();
  });
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend();
    else if (!muted) ctx.resume();
  });

  /* ---- per frame: follow the weather, and listen for things happening in the scene ---- */
  const stepSeen = new Map();
  const fryPrev = new WeakMap();
  let gPrev = 'idle', gCycle = 0, gHadFry = false, farCall = 7, horned = false;
  function update(dt, T) {
    if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    const to = (param, v, tc) => param.setTargetAtTime(v, now, tc || 0.1);

    const surfK = clamp(W.surf / 0.38, 0.6, 1.6);
    for (const v of surfVoices) {
      const s = swash(v.x, T);
      let env, cut;
      if (s.p < 0.06) { env = smooth(s.p / 0.06); cut = 900 + 2400 * env; }
      else { const q = s.p - 0.06; env = 0.85 * Math.exp(-q * 3.2) + 0.15 * Math.exp(-q * 0.9); cut = 450 + 2600 * Math.exp(-q * 2.6); }
      to(v.g.gain, (0.03 + 0.24 * env * s.size) * surfK * v.w, 0.04);
      to(v.f.frequency, cut, 0.05);
      if (v.pn.pan) to(v.pn.pan, panOf(tmpV.set(v.x, 0, shoreZ(v.x))), 0.5);
    }
    to(rumble.gain, 0.08 + 0.05 * W.wind);
    const gust = 0.5 + 0.5 * Math.sin(T * 0.37) * Math.sin(T * 0.11 + 1.3);
    to(wind.g.gain, (0.015 + 0.14 * smooth((W.wind - 0.8) / 0.7)) * (0.55 + 0.45 * gust) + 0.04 * W.rain, 0.3);
    to(wind.f.frequency, 320 + 520 * gust, 0.4);
    if (wind.p.pan) to(wind.p.pan, 0.5 * Math.sin(T * 0.06), 1);
    to(rain.g.gain, 0.22 * W.rain, 0.5);
    if (W.rain > 0.02) {
      const n = Math.floor(W.rain * 28 * dt + Math.random());
      for (let i = 0; i < n; i++) {
        tone(now + Math.random() * dt, 0.02, 'sine', rand(2500, 5200), rand(1500, 2500), rand(0.01, 0.03) * W.rain, rand(-0.8, 0.8), 0.1);
      }
    }

    // footsteps: one per half stride
    const seen = new Set();
    for (const w of walkers) {
      seen.add(w.id);
      const s = Math.floor(w.phase / Math.PI);
      const prev = stepSeen.get(w.id);
      if (prev !== undefined && s !== prev) step(w.p.root.position, (w.kid ? 0.6 : 1) * w.pace);
      stepSeen.set(w.id, s);
    }
    for (const id of stepSeen.keys()) if (!seen.has(id)) stepSeen.delete(id);

    // fries hitting the sand
    for (const f of fries) {
      const pr = fryPrev.get(f);
      if (pr) {
        if (!pr.bounced && f.bounced) thud(f.mesh.position, 1);
        else if (pr.state === 'fall' && f.state === 'settle') thud(f.mesh.position, 0.45);
      }
      fryPrev.set(f, { state: f.state, bounced: f.bounced });
    }

    // the gull: a call as it comes in, landing, the snatch, a laugh as it leaves, and every wing beat
    const gpos = G.obj.position;
    if (gull.state !== gPrev) {
      if (gull.state === 'approach') gullCall(gpos, 'long', false);
      else if (gull.state === 'pick') { thud(gpos, 0.5); flap(gpos, 0.8); }
      else if (gull.state === 'leave') gullCall(gpos, 'laugh', false);
      gPrev = gull.state;
    }
    if (gull.state !== 'idle') {
      const c = Math.floor(gull.ph / TAU);
      if (c !== gCycle && gull.pose.amp > 0.25) flap(gpos, gull.pose.amp);
      gCycle = c;
    }
    if (gull.fry && !gHadFry) snatch(gpos);
    gHadFry = !!gull.fry;

    // the pair wheeling over the water call now and then, less in the rain
    farCall -= dt;
    if (farCall <= 0) {
      gullCall(pick(farGulls).g.obj.position, Math.random() < 0.5 ? 'long' : 'laugh', true);
      farCall = rand(10, 24) * (1 + 1.5 * W.rain);
    }

    // the old liner sounds its horn once as it comes into view
    if (voyage.active && !horned && voyage.x > -420) { horned = true; horn(titanic.position); }
    if (!voyage.active) horned = false;

    scheduleMusic();
  }
  return { update };
})();

/* ======================= Start ======================= */
buildTitanic();
buildHarbour();
[[-2.8, 9.8], [1.5, 12.4], [3.9, 9.3], [-0.5, 13.6], [-4.8, 12.0]].forEach(([x, z]) => placeRestingFry(x, z));
spawnWalker(-3.5);
spawnWalker(5.5);
walkers[1].dir = -1; walkers[1].yaw = -Math.PI / 2; walkers[1].p.root.rotation.y = -Math.PI / 2;
if (walkers[1].dropX !== null) walkers[1].dropX = rand(-4, 2);

let T = 8;
WT = T;
updateWeather(WT, 0); applyWeather(0);
resize();

let last = performance.now();
let perfAcc = 0, perfFrames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000;
  last = now;
  const dt = clamp(raw, 0, 0.05);
  T += dt;
  U.uTime.value = T;
  WT += dt;
  if (manual.on && manual.release && manual.k >= 1) { manual.on = false; manual.release = false; WT = manual.target * SEG; }
  updateWeather(WT, dt);
  applyWeather(dt);
  updateWalkers(dt);
  updateFries(dt);
  updateGull(dt);
  updateFarGulls(dt, T);
  updateShip(dt, T);
  updateHarbour(dt, T);
  sound.update(dt, T);
  boat.position.x += dt * 0.6;
  if (boat.position.x > 160) boat.position.x = -160;
  sky.position.copy(camera.position);
  renderFrame(T);
  // gentle adaptive resolution for slower devices
  perfAcc += raw; perfFrames++;
  if (perfFrames >= 90) {
    const avg = perfAcc / perfFrames;
    if (avg > 0.034 && pixelRatio > 0.6) { pixelRatio = Math.max(0.6, Math.min(pixelRatio, renderer.getPixelRatio()) * 0.85); resize(); }
    perfAcc = 0; perfFrames = 0;
  }
}
requestAnimationFrame(frame);
})();
</script>
